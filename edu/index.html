<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>進香衛教・白沙屯拱天宮醫護團</title>
<meta name="description" content="進香常見狀況與照護重點：外傷、防曬、足部水泡、補水抽筋、中暑、緊急聯絡。">
<meta property="og:title" content="進香衛教・白沙屯拱天宮醫護團">
<meta property="og:description" content="六則四格漫畫，看懂進香路上常見狀況怎麼處理。">
<meta property="og:image" content="https://tsushin-buishatun.pages.dev/edu/img/heat.jpg">
<meta name="theme-color" content="#f6e3d6">
<link rel="icon" href="/share/mascot.png">
<style>
  :root{--red:#c2414f;--ink:#1f2430;--sub:#6b6360}
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}body{margin:0;min-height:100vh;color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%;line-height:1.55;
    background:radial-gradient(900px 500px at 100% 0,#ffd9bf,transparent 60%),radial-gradient(700px 500px at 0 100%,#ffe0e3,transparent 60%),#fbf1ea}
  .card{max-width:520px;margin:0 auto;padding:18px 14px calc(24px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
  /* 名片頭 */
  .swoosh{position:absolute;left:-30px;right:-30px;top:-10px;height:120px;background:linear-gradient(100deg,#f08339cc,#fbb57d55 60%,transparent);border-radius:0 0 60% 40%;transform:rotate(-4deg);z-index:0}
  .temple{position:absolute;right:10px;top:16px;width:150px;opacity:.35;z-index:0}
  .hd{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding-top:30px}
  .hd svg{width:56px;height:56px;flex:none;filter:drop-shadow(0 2px 4px rgba(194,65,79,.25))}
  .hd h1{margin:0;font-size:28px;font-weight:900;color:var(--red);letter-spacing:1px;line-height:1.15;text-shadow:0 1px 0 #fff}
  .hd small{display:block;font-size:9.5px;letter-spacing:1.8px;color:#6b4a3f;font-weight:800;margin-top:3px}
  .mid{position:relative;z-index:1;display:flex;gap:12px;align-items:center;margin-top:18px}
  .mid .l{flex:1;min-width:0}
  .badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,#c2414f,#e8590c);color:#fff;font-size:28px;font-weight:900;letter-spacing:3px;border-radius:999px;padding:6px 20px 6px 14px;box-shadow:0 6px 14px rgba(194,65,79,.3)}
  .sub{display:inline-flex;align-items:center;gap:4px;margin-top:10px;background:#fff8f0;border:1.5px solid #f5d6c1;border-radius:999px;padding:4px 12px;font-size:14.5px;font-weight:900;color:#7c2d12}
  .call{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:112px;height:112px;border-radius:22px;background:#fff;border:3px solid #fca5a5;text-decoration:none;color:#b91c1c;font-weight:900;box-shadow:0 6px 16px rgba(185,28,28,.15)}
  .call b{font-size:34px;line-height:1}.call span{font-size:12.5px;margin-top:4px}
  .hint{position:relative;z-index:1;text-align:center;font-size:14px;color:#7c2d12;font-weight:800;margin:18px 0 8px}
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{all:unset;cursor:pointer;display:block;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(150,60,40,.14);border:2px solid #fff;-webkit-tap-highlight-color:transparent;transition:transform .15s}
  .tile:active{transform:scale(.96)}
  .tile img{display:block;width:100%;aspect-ratio:1.1;object-fit:cover}
  .tile span{display:flex;align-items:center;justify-content:center;gap:3px;min-height:44px;padding:4px 3px;font-size:12.5px;letter-spacing:-.3px;font-weight:900;text-align:center;line-height:1.25;background:#fffaf5}
  .tile i{flex:none;width:18px;height:18px;border-radius:50%;color:#fff;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
  footer{position:relative;z-index:1;margin-top:20px;text-align:center;color:var(--sub);font-size:12px;line-height:1.7}
  footer .disc{background:#ffffffcc;border-radius:14px;padding:10px 12px;margin-bottom:10px;text-align:left}
  /* 漫畫彈窗 */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(31,36,48,.55);display:none;align-items:flex-end;justify-content:center}
  .ov.on{display:flex}
  .sh{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:24px 24px 0 0;animation:up .25s ease-out;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .sh-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--c);color:#fff}
  .sh-h small{font-size:12px;font-weight:900;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 9px}
  .sh-h b{flex:1;font-size:21px;font-weight:900}
  .sh-h button{border:none;background:rgba(255,255,255,.25);color:#fff;width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:900;cursor:pointer}
  .comic{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;background:#fbf5f1}
  .comic figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .comic img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
  .comic figcaption{display:flex;align-items:center;gap:6px;padding:7px 8px;font-size:14px;font-weight:900;line-height:1.3;min-height:48px}
  .comic figcaption i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-size:12.5px;display:flex;align-items:center;justify-content:center}
  .bd{padding:6px 18px 4px}
  .bd h3{margin:8px 0 2px;font-size:17px;font-weight:900;color:var(--c)}
  ol{margin:0;padding:0;list-style:none;counter-reset:s}
  ol li{counter-increment:s;position:relative;padding:8px 0 8px 38px;font-size:16px;border-top:1px dashed #f0e4de}
  ol li:first-child{border-top:none}
  ol li:before{content:counter(s);position:absolute;left:0;top:10px;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:13.5px;display:flex;align-items:center;justify-content:center}
  ol li .h{display:block;font-size:17px;font-weight:900}ol li b{color:#b91c1c}
  .warn{margin:12px 0 0;background:#fef2f2;border:2px solid #fecaca;border-radius:16px;padding:12px 14px;color:#7f1d1d}
  .warn>b{display:block;color:#b91c1c;font-size:16px}
  .warn ul{margin:4px 0 0;padding:0;list-style:none}.warn li{position:relative;padding:3px 0 3px 18px;font-size:15.5px}.warn li:before{content:'!';position:absolute;left:3px;color:#dc2626;font-weight:900}
  .warn a{display:inline-flex;margin-top:8px;text-decoration:none;background:#dc2626;color:#fff;font-weight:900;border-radius:999px;padding:8px 18px;font-size:15px}
  .nav{display:flex;gap:10px;padding:14px 18px 4px}
  .nav button{flex:1;border:none;border-radius:14px;padding:12px 6px;font:inherit;font-size:14.5px;font-weight:900;cursor:pointer;background:#f6efeb;color:#7c2d12}
  .nav button.nx{background:var(--c);color:#fff}
  .nav button:disabled{opacity:.35}
</style>
</head>
<body>
<div class="card">
  <div class="swoosh"></div>
  <svg class="temple" viewBox="0 0 160 80" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 30 Q80 8 140 30"/><path d="M14 31 Q30 30 36 24 M146 31 Q130 30 124 24"/><path d="M40 30v40M120 30v40M30 70h100M55 36v34M105 36v34M65 46h30v24H65z"/><path d="M30 46 Q80 34 130 46"/><path d="M80 8v-6"/></svg>
  <div class="hd">
    <svg viewBox="0 0 64 64"><path d="M30 54C14 43 6 34 6 23 6 15 12 9 20 9c5 0 9 3 11 7 2-4 6-7 11-7" fill="none" stroke="#c2414f" stroke-width="4.5" stroke-linecap="round"/><path d="M34 52c12-8 20-17 22-25" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><g transform="translate(38 34)" fill="#c2414f"><rect x="-4" y="-15" width="8" height="30" rx="1.5"/><rect x="-4" y="-15" width="8" height="30" rx="1.5" transform="rotate(60)"/><rect x="-4" y="-15" width="8" height="30" rx="1.5" transform="rotate(-60)"/><path d="M0 -11v22" stroke="#fff" stroke-width="1.6"/><path d="M-2 -6c3 1 3 3 0 4s-3 3 0 4 3 3 0 4" stroke="#fff" stroke-width="1.3" fill="none"/></g></svg>
    <div><h1>白沙屯拱天宮醫護團</h1><small>BAISHATUN EMS VOLUNTEER TEAM</small></div>
  </div>
  <div class="mid">
    <div class="l"><span class="badge">📣 衛教介紹</span><br><span class="sub">📍 進香常見狀況與照護重點</span></div>
    <a class="call" href="tel:119"><span>🚑 緊急請撥</span><b>119</b></a>
  </div>
  <div class="hint">👇 點一張漫畫，看怎麼處理</div>
  <div class="grid"><button class="tile" data-i="0"><img src="img/wound.jpg" alt=""><span><i style="background:#E03131">1</i>外傷處理</span></button><button class="tile" data-i="1"><img src="img/sun.jpg" alt=""><span><i style="background:#F59F00">2</i>防曬與熱傷害</span></button><button class="tile" data-i="2"><img src="img/foot.jpg" alt=""><span><i style="background:#F08C00">3</i>足部保護與水泡</span></button><button class="tile" data-i="3"><img src="img/water.jpg" alt=""><span><i style="background:#1C7ED6">4</i>補水與預防抽筋</span></button><button class="tile" data-i="4"><img src="img/heat.jpg" alt=""><span><i style="background:#E8590C">5</i>中暑處置與休息</span></button><button class="tile" data-i="5"><img src="img/help.jpg" alt=""><span><i style="background:#D6336C">6</i>活動協助與緊急聯絡</span></button></div>
  <footer>
    <div class="disc">📌 本衛教內容由白沙屯拱天宮醫護團（慈昕醫護協會）製作，歡迎分享轉傳，請勿修改內容或商業使用。內容僅供衛教參考，不能取代醫師診斷；身體不舒服請找穿橘衣的醫護團員，緊急狀況請撥 119。</div>
    ©2026 白沙屯拱天宮醫護團（慈昕醫護協會）・歡迎分享
  </footer>
</div>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<script>
const D = [{"k": "wound", "t": "外傷處理", "c": "#E03131", "cap": ["坐下來，先看哪裡受傷", "扭傷：冰敷 15～20 分鐘", "彈性繃帶包紮、抬高", "擦傷：清水沖乾淨、蓋紗布"], "pts": [["先停下來", "坐好，看看哪裡受傷，<b>不要硬走</b>"], ["扭傷冰敷", "冰袋<b>用毛巾包著</b>，敷 15～20 分鐘"], ["包紮抬高", "彈性繃帶固定，坐下時把腳<b>抬高</b>"], ["擦傷沖乾淨", "清水或生理食鹽水沖掉沙子，再用紗布蓋好"]], "warn": ["腳不能踩地、看起來變形", "血壓了 10 分鐘還止不住", "撞到頭後頭痛、嘔吐、想睡"], "call": true}, {"k": "sun", "t": "防曬與熱傷害", "c": "#F59F00", "cap": ["出門前先擦防曬", "戴帽子、穿袖套", "曬紅了先冷敷", "擦蘆薈舒緩"], "pts": [["擦防曬", "SPF 30 以上，流汗後約<b>每 2 小時補擦</b>"], ["遮起來", "寬邊帽、袖套、淺色薄長袖"], ["曬傷冷敷", "冷毛巾敷，讓皮膚降溫"], ["舒緩保濕", "擦蘆薈或乳液，起水泡<b>不要弄破</b>"]], "warn": ["大片起水泡、發燒、發冷", "頭暈、頭痛、噁心想吐（可能是熱傷害）"], "call": false}, {"k": "foot", "t": "足部保護與水泡", "c": "#F08C00", "cap": ["穿合腳的舊鞋", "襪子濕了就換", "磨紅了就貼保護", "休息時脫鞋透氣"], "pts": [["穿合腳舊鞋", "<b>不要穿新鞋</b>上路"], ["排汗襪多帶", "襪子濕了就換"], ["一磨紅就貼", "人工皮或膠布先貼起來；水泡<b>不要自己刺破</b>"], ["讓腳休息", "休息時脫鞋透氣，晚上泡腳、抬高"]], "warn": ["紅、腫、熱、痛越來越嚴重或流膿", "有糖尿病的人腳受傷"], "call": false}, {"k": "water", "t": "補水與預防抽筋", "c": "#1C7ED6", "cap": ["小腿突然抽筋，先停下來", "腳板往身體扳、拉直小腿", "緩解後輕輕按摩", "補充水分和電解質"], "pts": [["先停下來坐好", "腳伸直，<b>不要硬走</b>"], ["拉直小腿", "把<b>腳板慢慢往身體方向扳</b>，維持一下"], ["輕輕按摩", "抽筋緩解後，按摩放鬆"], ["補充水分", "少量多次喝水，流很多汗喝<b>運動飲料</b>"]], "warn": ["反覆抽筋、劇痛或腫脹", "同時頭暈、很虛弱、尿很少"], "call": false}, {"k": "heat", "t": "中暑處置與休息", "c": "#E8590C", "cap": ["移到陰涼處躺下、抬高腳", "搧風、濕毛巾擦身體", "冰敷脖子和腋下", "意識清楚才小口喝水"], "pts": [["移到陰涼處", "躺下、<b>抬高雙腳</b>、鬆開衣物"], ["趕快降溫", "搧風、用濕毛巾擦身體"], ["冰敷", "冰敷<b>脖子、腋下、大腿根部</b>"], ["小口補水", "<b>意識清楚</b>才小口喝，不要硬灌"]], "warn": ["叫不醒、說話怪怪的", "抽搐、昏倒", "體溫很高、皮膚很燙"], "call": true}, {"k": "help", "t": "活動協助與緊急聯絡", "c": "#D6336C", "cap": ["看到橘衣醫護團就揮手", "不舒服就說出來", "緊急狀況撥 119", "醫護團用無線電叫支援"], "pts": [["找醫護團", "穿<b>橘色衣服</b>、戴 EMS 帽子、手臂有臂章"], ["不舒服就說", "跟身邊的人說「需要醫護」，請他幫忙叫人"], ["撥 119 說清楚", "<b>在哪裡</b>（路名、廟、地標）、<b>怎麼了</b>、幾個人"], ["等待時", "陪在旁邊；撞到頭或脖子<b>不要隨便移動</b>"]], "warn": ["昏倒、叫不醒", "胸痛、呼吸困難", "大量出血"], "call": true}];
const ov = document.getElementById('ov'), sh = document.getElementById('sh');
function open(i) {
  const d = D[i];
  sh.style.setProperty('--c', d.c);
  sh.innerHTML = `<div class="sh-h"><small>${i + 1} / ${D.length}</small><b>${d.t}</b><button id="x" aria-label="關閉">✕</button></div>
    <div class="comic">${d.cap.map((c, j) => `<figure><img src="img/${d.k}-${j + 1}.jpg" alt="${c}"><figcaption><i>${j + 1}</i>${c}</figcaption></figure>`).join('')}</div>
    <div class="bd"><h3>重點整理</h3><ol>${d.pts.map(([a, b]) => `<li><span class="h">${a}</span>${b}</li>`).join('')}</ol>
      <div class="warn"><b>⚠️ 有這些情況，${d.call ? '請撥 119' : '請找醫護團'}</b><ul>${d.warn.map(w => `<li>${w}</li>`).join('')}</ul>${d.call ? '<a href="tel:119">📞 撥打 119</a>' : ''}</div></div>
    <div class="nav"><button id="pv" ${i ? '' : 'disabled'}>‹ 上一則</button><button class="nx" id="nx">${i < D.length - 1 ? '下一則 ›' : '看完了 ✓'}</button></div>`;
  sh.scrollTop = 0; ov.classList.add('on'); document.body.style.overflow = 'hidden';
  document.getElementById('x').onclick = close;
  document.getElementById('pv').onclick = () => open(i - 1);
  document.getElementById('nx').onclick = () => i < D.length - 1 ? open(i + 1) : close();
  try { history.replaceState(null, '', '#' + d.k); } catch (e) {}
}
function close() { ov.classList.remove('on'); document.body.style.overflow = ''; try { history.replaceState(null, '', location.pathname); } catch (e) {} }
ov.onclick = e => { if (e.target === ov) close(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
document.querySelectorAll('.tile').forEach(b => b.onclick = () => open(+b.dataset.i));
{ const i = D.findIndex(d => '#' + d.k === location.hash); if (i >= 0) open(i); }
</script>
</body>
</html>
