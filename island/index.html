<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>白沙屯媽祖進香島｜白沙屯 → 北港</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--pink:#e85a8c;--pink-d:#c43a6e;--pink-l:#fde8ef;--gold:#d2922a;--gold-l:#fdf4e3;--ink:#2a1f1d;--mute:#7a6a64;--line:#eadcd3;--paper:#fffaf6;--card:#fffffff0;--panel:392px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:#e9f0ea}
button{font-family:inherit;color:inherit}
#stage{position:fixed;inset:0;right:var(--panel);background:linear-gradient(#f3ecdf 0%,#cfe3e2 40%,#79bcc9 100%)}
canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pill{position:absolute;transform:translate(-50%,-135%);display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:4px 10px 4px 5px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px #3a201822;pointer-events:auto;cursor:pointer;transition:opacity .2s;border:1.5px solid transparent}
.pill b{font:500 10px "JetBrains Mono",monospace;background:var(--pink);color:#fff;border-radius:999px;padding:2px 6px}
.pill.ret b{background:var(--gold)}
.pill.on{border-color:var(--ink);z-index:3}
.pill.small{font-size:11px;padding:3px 8px 3px 4px}
.pill.hide{opacity:0;pointer-events:none}
.tagl{position:absolute;transform:translate(-50%,-100%);background:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 9px;box-shadow:0 2px 8px #3a201826;white-space:nowrap}
.tagl.med{background:#f47b20;color:#fff}.tagl.emt{background:#fff;color:#d9182e;border:1.5px solid #d9182e}.tagl.big{font-size:13px;padding:4px 12px;z-index:5;box-shadow:0 0 0 3px #ffffffcc,0 4px 12px #e85a8c66}.tagl.big:before{content:'🩷 '}.tagl.gv{background:#fff7e0;color:#9a6a10}.tagl.me{padding:3px 10px;font-size:12px;z-index:4;border:1.5px solid #f47b20}.tagl.me b{margin-right:4px}.tagl.me{color:#f47b20}.tagl.me b{color:#2a1f1d}.tagl.pk{background:var(--pink);color:#fff}
.pill:after{content:"";position:absolute;left:50%;bottom:-6px;width:2px;height:6px;background:#fff;transform:translateX(-50%)}

#brand{position:fixed;left:16px;top:16px;background:var(--card);backdrop-filter:blur(8px);border-radius:18px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 24px #3a201818;z-index:5}
#brand .big{font-family:"Noto Serif TC",serif;font-weight:900;font-size:30px;line-height:.95;color:var(--pink);letter-spacing:1px}
#brand .big small{display:block;font:500 10px "JetBrains Mono",monospace;color:var(--mute);letter-spacing:2px;margin-top:6px}
#brand .sub{border-left:1px solid var(--line);padding-left:14px;font-weight:900;font-size:16px;line-height:1.35}
#brand .sub span{display:block;color:var(--pink);font-size:12px;font-weight:700}
#tools{position:fixed;top:16px;right:calc(var(--panel) + 16px);display:flex;gap:8px;z-index:5}
.btn{background:var(--card);backdrop-filter:blur(8px);border:none;border-radius:12px;padding:9px 13px;font:600 13px "Noto Sans TC";box-shadow:0 4px 14px #3a201814;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn.on{background:var(--ink);color:#fff}

#player{position:fixed;left:50%;bottom:16px;transform:translateX(calc(-50% - var(--panel)/2));z-index:5;background:var(--card);backdrop-filter:blur(8px);border-radius:20px;padding:10px 14px 12px;box-shadow:0 6px 24px #3a201820;width:min(600px,calc(100vw - var(--panel) - 32px))}
#player .r1{display:flex;align-items:center;gap:12px}
#play{width:42px;height:42px;border-radius:50%;border:none;background:var(--pink);color:#fff;font-size:15px;cursor:pointer;flex:none}
#now{flex:1;min-width:0}
#now b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now span{font:500 11px "JetBrains Mono",monospace;color:var(--mute)}
#km{font:500 12px "JetBrains Mono",monospace;color:var(--mute);text-align:right;white-space:nowrap}
#track{position:relative;margin-top:8px}
#scrub{width:100%;accent-color:var(--pink);display:block}
#days{display:flex;gap:4px;margin-top:6px}
#days button{flex:1;border:none;background:#f4ebe4;border-radius:8px;padding:5px 0;font:600 11px "JetBrains Mono",monospace;color:var(--mute);cursor:pointer}
#days button.on{background:var(--pink);color:#fff}
#days button.ret.on{background:var(--gold)}

#detail{position:fixed;left:16px;top:100px;bottom:150px;width:344px;background:var(--paper);border-radius:20px;box-shadow:0 10px 40px #3a201828;z-index:6;display:flex;flex-direction:column;overflow:hidden;transform:translateX(-125%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#detail.open{transform:none}
#detail .hd{padding:18px 18px 12px;display:flex;gap:12px;align-items:flex-start}
#detail .ic{width:48px;height:48px;border-radius:14px;background:var(--pink-l);display:grid;place-items:center;font-size:22px;flex:none;overflow:hidden}
.kick{font:500 10px "JetBrains Mono",monospace;letter-spacing:1.5px;color:var(--pink)}
#detail h2{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:900;margin-top:2px;line-height:1.25}
#detail .x{margin-left:auto;border:none;background:none;font-size:22px;cursor:pointer;color:var(--mute);line-height:1}
#detail .bd{padding:0 18px 18px;overflow:auto;flex:1}
.lead{font-size:14px;line-height:1.75}
blockquote{border-left:3px solid var(--pink);padding:4px 0 4px 12px;margin:14px 0;color:#5b4842;font-size:14px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff}
.chip.p{color:var(--pink-d);border-color:#f6c3d5;background:var(--pink-l)}
.chip.g{color:#9a6a10;border-color:#f0d9a8;background:var(--gold-l)}
button.chip{cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 3px}
h4{font-size:11px;color:var(--mute);margin:16px 0 8px;letter-spacing:1px;font-weight:700}
.row{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;font-size:13px;line-height:1.55}
.row time{font:500 11px "JetBrains Mono",monospace;color:var(--pink-d);background:var(--pink-l);border-radius:6px;padding:2px 6px;white-space:nowrap;flex:none;margin-top:1px}
.row.ret time{color:#9a6a10;background:var(--gold-l)}
.row i{font-style:normal;color:var(--pink);flex:none}
.nav2{display:flex;gap:8px;margin-top:14px}
.nav2 button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:600 13px "Noto Sans TC";cursor:pointer}
.nav2 button:disabled{opacity:.35}

#panel{position:fixed;right:0;top:0;bottom:0;width:var(--panel);background:var(--paper);border-left:1px solid var(--line);z-index:7;display:flex;flex-direction:column}
#panel .top{padding:22px 22px 8px}
#panel h1{font-family:"Noto Serif TC",serif;font-size:25px;font-weight:900;margin:6px 0}
#panel .meta{font-size:12px;color:var(--mute);line-height:1.6}
.callout{margin:12px 0 0;background:#fff;border:1px solid #f6c3d5;border-radius:14px;padding:11px 14px;font-size:12px;line-height:1.55;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;width:100%;text-align:left}
.callout b{display:block;font-size:14px;color:var(--ink)}
.callout em{font-style:normal;color:var(--pink);font-size:18px}
.tabs{display:flex;gap:6px;padding:12px 22px 8px}
.tabs button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:#fff;font:600 13px "Noto Sans TC";cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#list{flex:1;overflow:auto;padding:0 22px 30px}
.day{display:flex;align-items:baseline;gap:10px;margin:18px 0 2px;cursor:pointer}
.day .n{font-family:"Noto Serif TC",serif;font-style:italic;font-size:24px;color:var(--pink);font-weight:700}
.day.ret .n{color:var(--gold)}
.day .t{flex:1;font-weight:900;font-size:15px}
.day .t small{display:block;font:500 10px "JetBrains Mono",monospace;color:var(--mute);letter-spacing:1px;margin-top:1px}
.day .k{font:500 11px "JetBrains Mono",monospace;color:var(--mute)}
.it{display:flex;align-items:center;gap:10px;padding:9px 6px 9px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.it:hover,.it.on{background:#fff0f5}
.it time{font:500 11px "JetBrains Mono",monospace;color:var(--mute);width:48px;flex:none}
.it .t{flex:1;font-weight:700;font-size:13.5px}
.it .t small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.tg{font-size:10px;font-weight:700;border-radius:999px;padding:3px 8px;background:#f4ebe4;color:var(--mute);white-space:nowrap}
.tg.k1{background:var(--pink);color:#fff}.tg.k2{background:var(--ink);color:#fff}.tg.k3{background:#d9eef0;color:#2f7f86}.tg.k4{background:var(--gold);color:#fff}
.sec{font:500 10px "JetBrains Mono",monospace;letter-spacing:2px;color:var(--mute);margin:18px 0 6px}
.pc{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pc:hover{border-color:var(--pink)}
.pc b{font-size:14px}.pc small{display:block;font-size:11.5px;color:var(--mute);margin-top:1px;line-height:1.45}
.rit{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:6px;cursor:pointer}
.rit:before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid var(--paper)}
.rit.ret:before{background:var(--gold)}
.rit time{font:500 11px "JetBrains Mono",monospace;color:var(--pink-d)}
.rit b{display:block;font-size:15px;margin:1px 0 2px}
.rit p{font-size:12.5px;line-height:1.6;color:#5b4842}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-family:"Noto Serif TC",serif;font-size:24px;color:var(--pink);line-height:1.1}
.tile span{font-size:11.5px;color:var(--mute);line-height:1.45;display:block;margin-top:4px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;margin:7px 0}
.bar label{width:42px;font:500 11px "JetBrains Mono",monospace;color:var(--mute)}
.bar div{height:18px;border-radius:5px;background:var(--pink);min-width:3px}
.bar.g div{background:var(--gold)}
.bar span{font-weight:700;white-space:nowrap}
.fact{font-size:12.5px;line-height:1.65;padding:9px 0;border-bottom:1px solid var(--line)}
.fact b{color:var(--pink-d)}
.src{font-size:11px;color:#9a8a84;margin-top:16px;line-height:1.6}

.modal{position:fixed;inset:0;background:#2a1f1d55;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20}
.modal .box{background:var(--paper);border-radius:22px;padding:26px;width:min(400px,92vw);box-shadow:0 20px 60px #0003;max-height:90vh;overflow:auto}
.modal h3{font-family:"Noto Serif TC",serif;font-size:23px;margin:10px 0}
.modal p{font-size:13px;line-height:1.75;color:#5b4842}
.acts{display:flex;justify-content:space-between;margin-top:20px;gap:8px}
.acts button,.opt{border-radius:12px;padding:10px 16px;font:600 14px "Noto Sans TC";cursor:pointer;border:1px solid var(--line);background:#fff}
.acts .go{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt{display:block;width:100%;text-align:left;margin-top:8px;font-weight:500}
.opt:hover{border-color:var(--pink);background:var(--pink-l)}
.dots{display:flex;gap:5px;margin-top:16px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{width:18px;background:var(--pink)}
#hint{position:fixed;left:16px;bottom:16px;font-size:11px;color:var(--mute);background:#ffffffb0;padding:5px 10px;border-radius:999px;z-index:4;pointer-events:none}
#sheetBtn{display:none}
#panel .grab{display:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;cursor:pointer}
@media (max-width:1180px){#hint{display:none}}
@media (max-width:760px){
  .tagl{font-size:10px;padding:1px 7px}.tagl.big{font-size:11px;padding:2px 9px}
  :root{--panel:0px}
  #stage{right:0}
  #brand{left:10px;top:10px;padding:9px 12px;gap:10px;border-radius:14px}
  #brand .big{font-size:21px}#brand .sub{font-size:13px;padding-left:10px}
  #tools{top:auto;bottom:150px;right:10px;flex-direction:column}
  #player{left:8px;right:8px;transform:none;width:auto;bottom:max(8px,env(safe-area-inset-bottom));padding:8px 10px 10px}
  #panel{top:auto;height:80vh;width:100%;border-left:none;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px #3a201830;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  #panel.open{transform:none}
  #panel .grab{display:block}#panel .top{padding-top:10px}
  #sheetBtn{display:flex}
  #detail{left:8px;right:8px;width:auto;top:auto;bottom:138px;max-height:44vh;transform:translateY(calc(100% + 160px))}
  #detail.open{transform:none}
}
</style>
</head>
<body>
<div id="stage"><div id="labels"></div></div>
<div id="brand"><div class="big">進香島<small>BAISHATUN → BEIGANG</small></div><div class="sub">白沙屯 → 北港<span>2026 丙午年 · 8 天 7 夜</span></div></div>
<div id="tools">
  <button class="btn" id="bAll">⤢ 全景</button>
  <button class="btn" id="bFollow">◎ 跟轎</button>
  <button class="btn" id="sheetBtn">☰ 清單</button>
  <button class="btn" id="bHelp">?</button>
</div>
<div id="player">
  <div class="r1"><button id="play" aria-label="播放">▶</button><div id="now"><b></b><span></span></div><div id="km"></div></div>
  <div id="track"><input id="scrub" type="range" min="0" max="2000" value="0"></div>
  <div id="days"></div>
</div>
<div id="hint">拖曳移動 · 滾輪縮放 · 右鍵旋轉</div>
<aside id="detail"><div class="hd"><div class="ic" id="dIc"></div><div><div class="kick" id="dKick"></div><h2 id="dTitle"></h2></div><button class="x" id="dX">×</button></div><div class="bd" id="dBody"></div></aside>
<aside id="panel">
  <div class="grab" id="grab"></div>
  <div class="top">
    <div class="kick">THE PILGRIM INDEX</div>
    <h1>一步一腳印，跟著媽祖走。</h1>
    <div class="meta" id="meta"></div>
    <button class="callout" id="quizBtn"><span><b>你是哪一種香燈腳？</b>四個問題，看看你在進香隊伍裡的位置。</span><em>›</em></button>
  </div>
  <div class="tabs"><button class="on" data-tab="route">行程</button><button data-tab="people">人物</button><button data-tab="rites">儀式</button><button data-tab="data">數據</button></div>
  <div id="list"></div>
</aside>
<div id="modal"></div>
