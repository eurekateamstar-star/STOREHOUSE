<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>團員定位｜白沙屯拱天宮醫護團</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --primary:#D65A68; --accent:#F08339; --ink:#1f2430; --sub:#6b7280; --line:#e5e7eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; }
  * { box-sizing:border-box; }
  html, body, button, a, .top, .sheet, .ov, .pn { touch-action:manipulation; }   /* 禁止連點兩下放大（iPhone 會把整頁放大，上方工具列和清單跑出畫面） */
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; max-width:100vw; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif; color:var(--ink); background:#f6f6f8; }
  .hidden { display:none !important; }
  #map { position:fixed; left:0; right:0; top:0; height:100vh; height:100dvh; z-index:1; }
  .top { position:fixed; z-index:500; top:calc(env(safe-area-inset-top) + 10px); left:10px; right:10px; display:flex; gap:8px; align-items:center;
         background:rgba(255,255,255,.95); border-radius:16px; padding:8px 10px; box-shadow:0 4px 18px rgba(0,0,0,.12); }
  .top .t { flex:1 1 auto; min-width:0; overflow:hidden; }
  .top .ib { flex:none; }
  .top h1 { margin:0; font-size:16px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:430px) { .top { gap:4px; padding:7px 8px; } .ib { padding:8px 7px; font-size:12.5px; } .top h1 { font-size:15px; } }
  .top .s { font-size:11.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-right:4px; vertical-align:middle; }
  .dot.err { background:var(--red); }
  .ib { border:0; background:#f3f4f6; border-radius:12px; padding:8px 10px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink); white-space:nowrap; }
  .ib.on { background:var(--blue); color:#fff; }
  .ib.p { background:var(--primary); color:#fff; }

  /* 底部清單 */
  .sheet { position:fixed; z-index:500; left:0; right:0; bottom:0; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.14);
           max-height:46vh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); transition:max-height .2s; }
  .sheet.min { max-height:64px; }
  .sh-h { display:flex; align-items:center; gap:8px; padding:10px 14px 8px; cursor:pointer; }
  .sh-h .grab { position:absolute; left:50%; top:5px; width:38px; height:4px; margin-left:-19px; border-radius:4px; background:#d1d5db; }
  .sh-h b { font-size:15px; }
  .sh-h .cnt { font-size:12px; color:var(--sub); flex:1; }
  .filters { display:flex; gap:6px; padding:0 14px 8px; overflow-x:auto; }
  .chip { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:4px 11px; font:inherit; font-size:12.5px; font-weight:700; white-space:nowrap; cursor:pointer; }
  .chip.on { border-color:var(--ink); background:var(--ink); color:#fff; }
  .list { overflow-y:auto; padding:0 8px 10px; }
  .row { display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:12px; cursor:pointer; }
  .row:active, .row.sel { background:#f3f4f6; }
  .row .e { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; flex:none; }
  .row .m { flex:1; min-width:0; }
  .row .n { font-weight:800; font-size:14.5px; }
  .row .d { font-size:12px; color:var(--sub); }
  .row .r { text-align:right; font-size:12px; color:var(--sub); white-space:nowrap; }
  .row .r .ago { font-weight:800; color:var(--green); font-size:13px; }
  .row.stale .ago { color:var(--amber); }
  .row.off { opacity:.5; }
  .row.off .ago { color:var(--sub); }
  .duty { border:0; border-radius:99px; padding:5px 10px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; margin-left:6px; white-space:nowrap; }
  .duty.on { background:#dcfce7; color:#15803d; } .duty.off { background:#f3f4f6; color:#6b7280; }
  .bar2 { display:flex; gap:8px; margin:8px 0 4px; } .bar2 .sb { flex:1; padding:10px; font-size:13.5px; }

  /* 地圖標記 */
  .mk { position:relative; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; pointer-events:auto; }
  .mk .b { width:38px; height:38px; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center; font-size:19px; box-shadow:0 3px 10px rgba(0,0,0,.3); }
  .mk .tip { width:0; height:0; border:7px solid transparent; border-top-color:#fff; margin-top:-2px; }
  .mk .l { position:absolute; top:100%; margin-top:-2px; white-space:nowrap; background:rgba(255,255,255,.95); border-radius:8px; padding:1px 7px; font-size:12px; font-weight:800; box-shadow:0 1px 5px rgba(0,0,0,.2); }
  .mk .l .tm { background:#c2414f; color:#fff; border-radius:5px; padding:0 4px; margin-right:4px; font-size:11px; }
  .mk .l small { font-weight:600; color:var(--sub); margin-left:3px; }
  .mk.stale .b { filter:grayscale(1); opacity:.65; }
  .av { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .av.van { object-fit:contain; background:#fff; padding:2px; box-sizing:border-box; transform:scaleX(-1); }
  .mk .b.p { padding:0; overflow:hidden; border-width:3px; }
  .row .e.p { padding:0; overflow:hidden; border:2.5px solid #fff; box-shadow:0 0 0 2px var(--kc,#9ca3af); }
  .it .pic { width:30px; height:30px; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:4px; }
  .mk.stale .l { color:var(--sub); }
  .k-小組長 { background:#2563eb; } .k-指揮車 { background:#dc2626; } .k-物資車 { background:#d97706; } .k-其他 { background:#6b7280; }
  .row .e.k-小組長 { background:#dbeafe; } .row .e.k-指揮車 { background:#fee2e2; } .row .e.k-物資車 { background:#fef3c7; } .row .e.k-其他 { background:#f3f4f6; }
  .me-dot { width:16px; height:16px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 6px rgba(37,99,235,.25); transform:translate(-50%,-50%); }

  /* 全頁訊息 */
  .msg { position:fixed; inset:0; z-index:900; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(160deg,#fff7ed,#fef2f2 60%,#fff); }
  .msg .c { max-width:380px; width:100%; background:#fff; border-radius:20px; padding:26px 20px; text-align:center; box-shadow:0 10px 36px rgba(214,90,104,.15); }
  .msg .ic { font-size:44px; }
  .msg h2 { margin:8px 0 6px; font-size:19px; }
  .msg p { color:#4b5563; font-size:14.5px; line-height:1.7; margin:0 0 14px; }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:13px; font:inherit; font-size:15.5px; font-weight:800; cursor:pointer; background:var(--primary); color:#fff; text-decoration:none; text-align:center; }
  .btn.g { background:#06c755; } .btn.w { background:#f3f4f6; color:var(--ink); }
  .btn + .btn { margin-top:8px; }

  /* 管理面板 */
  .ov { position:fixed; left:0; right:0; top:0; height:100vh; height:100dvh; z-index:800; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; }
  .pn { box-sizing:border-box; overflow-x:hidden; background:#fff; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width:700px) { .ov { align-items:center; } .pn { border-radius:20px; } }
  .pn h3 { margin:0 0 4px; font-size:18px; display:flex; align-items:center; gap:8px; }
  .pn h3 .x { margin-left:auto; }
  .pn h4 { margin:18px 0 8px; font-size:14.5px; }
  .pn .hint { font-size:12.5px; color:var(--sub); line-height:1.6; }
  .it { display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:12px; margin-bottom:6px; }
  .it .m { flex:1; min-width:0; font-size:14px; }
  .it.tk { flex-wrap:wrap; } .it.tk .m { flex:1 1 100%; } .it.tk .duty { margin-left:0; margin-right:auto; }
  .it .m small { display:block; color:var(--sub); font-size:12px; }
  .sb { border:0; border-radius:10px; padding:6px 9px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; background:#f3f4f6; }
  .sb.d { background:#fee2e2; color:var(--red); }
  .fm { display:grid; gap:8px; background:#f9fafb; border-radius:14px; padding:12px; }
  .fm label { font-size:12.5px; font-weight:700; color:#374151; }
  .fm input, .fm select { width:100%; padding:10px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:15px; background:#fff; }
  .qr { display:flex; justify-content:center; padding:12px; background:#fff; border:1px solid var(--line); border-radius:14px; margin:10px 0; }
  .kv { font-size:13px; background:#f9fafb; border-radius:12px; padding:10px 12px; line-height:1.9; word-break:break-all; }
  .kv b { display:inline-block; min-width:56px; color:var(--sub); font-weight:700; }
  .warn { background:#fff7ed; border:1.5px dashed #fdba74; color:#9a3412; border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.6; margin:8px 0; }
  .car { margin:10px -4px 6px; }
  .quick { background:#f0fdf4; border:1.5px solid #bbf7d0; border-radius:16px; padding:14px; margin-top:10px; text-align:center; }
  .btn.big { font-size:18px; padding:16px; }
  .trk { overflow:hidden; touch-action:pan-y; transition:height .25s; }
  .rail { display:flex; will-change:transform; }
  .sl { flex:0 0 100%; align-self:flex-start; padding:0 4px; box-sizing:border-box; }
  .slh { display:flex; align-items:center; gap:8px; font-weight:900; font-size:16px; }
  .slh b { width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
  .slh small { margin-left:auto; color:var(--sub); font-size:12px; font-weight:700; }
  .slt { font-size:14px; line-height:1.7; margin:6px 0 8px; min-height:48px; }
  .sli { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .sli img { max-width:100%; max-height:46vh; object-fit:contain; border-radius:14px; border:1px solid var(--line); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .imp { display:inline-block; background:#dc2626; color:#fff; font-weight:900; font-size:13px; border-radius:8px; padding:3px 10px; margin:6px 0 0; }
  .easy { display:inline-block; background:#dcfce7; color:#15803d; font-weight:800; font-size:13px; border-radius:8px; padding:3px 10px; margin:6px 0 0; }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; align-items:start; }
  .g2 figure { margin:0; text-align:center; } .g2 img { max-height:24vh; }
  .g2 figcaption { font-size:12.5px; line-height:1.45; margin-top:2px; }
  .hero { width:200px; height:auto; margin:4px auto 10px; display:block; }
  .dl2 { display:flex; gap:8px; width:100%; } .dl2 .btn { flex:1; margin:0 !important; font-size:15px; padding:12px 8px; }
  .see { background:#f3f4f6; border-radius:10px; padding:8px 10px; font-size:14px; margin:4px 0 6px; }
  .tap { font-size:16px; margin:2px 0; }
  .vid { margin-top:12px; text-align:center; } .vid video { width:100%; max-width:300px; max-height:62vh; border-radius:14px; background:#000; margin:6px auto; display:block; }
  .cur { width:.85em; height:1.15em; vertical-align:-.2em; margin-right:3px; }
  .cheat { background:#fffbeb; border:1.5px solid #fcd34d; border-radius:14px; padding:12px 12px 6px; margin-top:12px; }
  .cht { font-weight:900; font-size:15px; } .cheat ol { margin:6px 0; padding-left:20px; font-size:13.5px; line-height:1.75; }
  .cnav { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .cnav .sb { padding:9px 12px; } .cnav .sb:disabled { opacity:.35; }
  #cdots { flex:1; display:flex; justify-content:center; gap:5px; flex-wrap:wrap; }
  #cdots i { width:7px; height:7px; border-radius:50%; background:#d1d5db; } #cdots i.on { background:var(--primary); width:16px; border-radius:4px; }
  .stp { display:flex; gap:10px; margin:12px 0; font-size:14px; line-height:1.7; }
  .stp > b { flex:none; width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; margin-top:1px; }
  .stp > div { flex:1; min-width:0; }
  .stp img { display:block; width:100%; max-width:340px; border-radius:12px; border:1px solid var(--line); margin:6px 0 8px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .seg { display:inline-flex; background:#e5e7eb; border-radius:99px; padding:3px; margin:6px 0; font-weight:700; font-size:13px; }
  .seg span { padding:5px 10px; border-radius:99px; color:#374151; } .seg span.on { background:#fff; box-shadow:0 0 0 2.5px #dc2626; color:#111; }
  ol.st { padding-left:20px; margin:6px 0; font-size:13.5px; line-height:1.75; }
  .trkbar { position:fixed; z-index:600; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 74px); background:#fff; border-radius:99px; padding:6px 8px 6px 14px; box-shadow:0 4px 14px rgba(0,0,0,.18); font-size:13px; font-weight:700; white-space:nowrap; display:flex; align-items:center; gap:8px; }
  .trkbar .leg { font-size:11.5px; font-weight:600; white-space:normal; max-width:70vw; line-height:1.5; }
  .ov.ask { align-items:center; z-index:1500; padding:24px; }
  .askb { background:#fff; border-radius:20px; padding:20px 18px 16px; width:100%; max-width:340px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .askt { font-size:17px; font-weight:900; margin-bottom:6px; }
  .askx { font-size:14px; color:#4b5563; line-height:1.65; }
  .aska { display:flex; gap:8px; margin-top:16px; } .aska .sb { flex:1; padding:12px; font-size:15px; }
  .toast { position:fixed; z-index:2000; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(17,24,39,.92); color:#fff; padding:9px 16px; border-radius:99px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .leaflet-top { top:calc(env(safe-area-inset-top) + 64px); }
</style>
</head>
<body>
<div id="map"></div>

<div class="top hidden" id="top">
  <div class="t"><h1>團員定位</h1><div class="s" id="status">載入中…</div></div>
  <button class="ib" id="b-fit" title="顯示全部">全部</button>
  <button class="ib" id="b-me" title="我的位置">🧭</button>
  <button class="ib hidden" id="b-qr" title="我的 OwnTracks 設定 QR Code">📱QR</button>
  <button class="ib p hidden" id="b-admin">⚙️管理</button>
</div>

<div class="sheet hidden" id="sheet">
  <div class="sh-h" id="sh-h"><span class="grab"></span><b>位置清單</b><span class="cnt" id="cnt"></span><span id="sh-arrow">▾</span></div>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
</div>

<div class="msg" id="msg"><div class="c"><div class="ic">⏳</div><h2>載入中</h2><p>正在確認登入狀態…</p></div></div>
<div class="toast" id="toast"></div>
<div class="trkbar hidden" id="trkbar"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, inMemoryPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // 和團員專區同一個 Firebase、同一個網域 → 在團員專區登入過就直接是登入狀態
  const app = initializeApp({
    apiKey: "AIzaSyA_5hmnIBCeLszWW8kIjgOZelv-c6-ALfY",
    authDomain: "linebot-firebase-b1242.firebaseapp.com",
    projectId: "linebot-firebase-b1242",
    storageBucket: "linebot-firebase-b1242.firebasestorage.app",
    messagingSenderId: "1002268658683",
    appId: "1:1002268658683:web:739adcd7819f8c9393595e"
  });
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const auth = initializeAuth(app, { persistence: isIOS ? [browserLocalPersistence, inMemoryPersistence] : [indexedDBLocalPersistence, browserLocalPersistence, inMemoryPersistence] });

  const W = 'https://bst-auth.eurekateamstar.workers.dev';
  const OT_URL = W + '/owntracks';
  const MEMBER_LIFF = 'https://liff.line.me/2011820105-x1KU6xLW?go=locate';
  const POLL = 15e3, STALE = 3 * 60e3;
  const KINDS = ['小組長', '指揮車', '物資車', '其他'];
  const EMOJI = { 小組長: '🙋', 指揮車: '🚩', 物資車: '🚚', 其他: '📍' };

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const toast = (t, ms = 2200) => { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), ms); };
  const ago = (ms, now) => { const s = Math.max(0, (now - ms) / 1000); if (s < 60) return '剛剛'; if (s < 3600) return Math.floor(s / 60) + ' 分鐘前';
    const d = new Date(ms); return (s < 86400 ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  function msg(ic, title, text, btns = '') { $('msg').innerHTML = `<div class="c"><div class="ic">${ic}</div><h2>${title}</h2><p>${text}</p>${btns}</div>`; $('msg').classList.remove('hidden'); }

  // ---------- 登入 ----------
  const user = await Promise.race([new Promise(r => { const off = onAuthStateChanged(auth, u => { if (u) { off(); r(u); } }); }), new Promise(r => setTimeout(() => r(auth.currentUser), 6000))]);
  if (!user) {
    msg('🔐', '請先登入團員專區', '定位地圖要用團員帳號查看。<br>請從 LINE 選單打開「團員專區」，再按「📍 團員定位」。',
      `<a class="btn g" href="${MEMBER_LIFF}">用 LINE 登入團員專區</a>`);
    throw new Error('not signed in');
  }

  // ---------- 地圖 ----------
  const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([24.5640, 120.7055], 14);   // 預設：白沙屯拱天宮附近
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  const marks = new Map(), circles = new Map();
  let items = [], mgr = false, sess = '', now = Date.now(), firstFit = true, filter = '全部', selId = '';

  async function api(path, body) {
    const r = await fetch(W + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({})); if (!r.ok && !j.error) j.error = '伺服器回應 ' + r.status; j._status = r.status; return j;
  }
  async function load() {
    let j;
    try { j = await api('/loc', { sess, idToken: await user.getIdToken() }); }
    catch (e) { setStatus(false, '連線失敗，稍後自動重試'); return; }
    if (j._status === 403 && j.canSelf && !load.triedSelf) { load.triedSelf = true; if (await myQR(true)) return; }
    if (j._status === 403) { msg('🙅', '沒有查看權限', esc(j.error || '') + '<br><br>需要的話請找完整管理員把你加入「可查看的人」。', `<a class="btn w" href="../member/">回團員專區</a>`); stop(); return; }
    if (j.error) { setStatus(false, j.error); return; }
    $('msg').classList.add('hidden'); $('top').classList.remove('hidden'); $('sheet').classList.remove('hidden');
    if (j.sess) sess = j.sess;
    items = j.items || []; mgr = !!j.mgr; now = j.now || Date.now();
    $('b-admin').classList.toggle('hidden', !mgr);
    $('b-qr').classList.toggle('hidden', !j.canSelf);
    if (j.selfNeed && !load.autoQR) { load.autoQR = true; setTimeout(() => myQR(true), 300); }   // 小組長第一次打開：直接給 QR Code

        <button class="btn" id="a-add">新增並產生設定 QR Code</button>
      </div>
      <h4>🛤 所有人的軌跡</h4>
      <div class="fm" style="grid-template-columns:1fr auto;align-items:end"><div><label>日期（保留 30 天）</label><select id="t-day">${[...Array(30)].map((_, k) => { const d = new Date(Date.now() + 8 * 3600e3 - k * 86400e3).toISOString().slice(0, 10); return `<option value="${d}">${d.slice(5).replace('-', '/')}${k === 0 ? '（今天）' : k === 1 ? '（昨天）' : ''}</option>`; }).join('')}</select></div>
        <button class="sb" id="t-show" style="padding:11px 14px;background:var(--ink);color:#fff">在地圖上顯示</button></div>
      <h4>👀 誰在看地圖（近 3 天）</h4>
      <div class="hint" style="margin-bottom:6px">已開通的團員都能看地圖。綠點＝正在看（1 分鐘內有更新）。</div>
      ${(st.watchers || []).map(w => { const live = Date.now() - w.last < 60e3; return `<div class="it"><div class="m"><b>${live ? '<span class="dot"></span>' : ''}${esc(w.name || '（未知）')}</b>
        <small>${live ? '正在看' : '最後 ' + esc(ago(w.last, Date.now()))}${w.day === new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10) ? `・今天從 ${new Date(w.first).toTimeString().slice(0, 5)} 開始・更新 ${w.n} 次` : ''}</small></div></div>`; }).join('') || '<div class="hint">還沒有人看過</div>'}`;
    o.querySelectorAll('[data-close]').forEach(b => b.onclick = () => o.remove());
    const again = () => { o.remove(); openAdmin(); load(); };
    o.querySelector('#t-show').onclick = async () => { const day = o.querySelector('#t-day').value; o.remove(); showAllTracks(day); };
    o.querySelector('#all-on').onclick = async () => { if (await setDuty({ all: true, on: true })) again(); };
    o.querySelector('#all-off').onclick = async () => { if (!(await ask('🌙 全部退勤', '所有裝置都退勤？<br>地圖留下最後位置（灰色），手機改成省電，不再記錄軌跡。', '全部退勤', false))) return; if (await setDuty({ all: true, on: false })) again(); };
    o.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { const t = tk.find(x => x.id === b.dataset.d); if (await setDuty({ id: t.id, on: t.duty === false })) again(); });
    o.querySelector('#a-add').onclick = async () => {
      const name = o.querySelector('#a-name').value.trim(); if (!name) { toast('請填名稱'); return; }
      const uid = o.querySelector('#a-uid').value, mm = members.find(m => m.uid === uid) || {};
      const r = await adm('add', { name, kind: o.querySelector('#a-kind').value, uid, uname: mm.name || '', pic: mm.pic || '', rkey: mm.rkey || '' });
      if (r.error) { toast(r.error); return; }
      o.remove(); showConfig(r); load();
    };
    o.querySelectorAll('[data-qr]').forEach(b => b.onclick = async () => {
      const r = await adm('qr', { id: b.dataset.qr }); if (r.error) { toast(r.error); return; } o.remove(); showConfig(r);
    });
    o.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const t = tk.find(x => x.id === b.dataset.del); if (!(await ask('🗑 刪除裝置', `刪除「${esc(t.name)}」？<br>這台的軌跡會一起刪除，手機之後上傳的位置都會被拒絕。`, '刪除'))) return;
      const r = await adm('del', { id: t.id }); if (r.error) { toast(r.error); return; } toast('已刪除'); again();
    });
    o.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      const t = tk.find(x => x.id === b.dataset.edit);
      const e = overlay(`<h3>編輯裝置<button class="sb x" data-close>取消</button></h3><div class="fm">
        <div><label>名稱</label><input id="e-name" maxlength="20" value="${esc(t.name)}"></div>
        <div><label>類型</label><select id="e-kind">${KINDS.map(k => `<option ${k === t.kind ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
        <div><label>綁定團員</label><select id="e-uid">${memberOpts(t.uid)}</select></div>
        <button class="btn" id="e-save">儲存</button></div>
        <h4>🔑 換新密碼</h4><div class="hint">手機遺失時用：舊設定立刻失效，新手機要重掃 QR Code。</div><button class="btn w" id="e-reset" style="margin-top:8px">換新密碼並顯示 QR Code</button>`);
      e.querySelector('#e-reset').onclick = async () => { if (!(await ask('🔑 換新密碼', '換新密碼後，原本那支手機就不能再回報，要重新匯入設定。', '換新密碼'))) return;
        const r = await adm('reset', { id: t.id }); if (r.error) { toast(r.error); return; } e.remove(); o.remove(); showConfig(r); };
      e.querySelector('#e-save').onclick = async () => {
        const uid = e.querySelector('#e-uid').value, mm = members.find(m => m.uid === uid) || {};
        const r = await adm('edit', { id: t.id, name: e.querySelector('#e-name').value.trim(), kind: e.querySelector('#e-kind').value, uid, uname: mm.name || '', pic: mm.pic || '', rkey: mm.rkey || '' });
        if (r.error) { toast(r.error); return; } e.remove(); toast('已儲存'); again();
      };
    });

  }

  // OwnTracks 設定：QR Code（手機相機掃）、直接開啟、下載設定檔、手動輸入
  function showConfig(r, self) {
    const cfg = { _type: 'configuration', mode: 3, url: OT_URL, auth: true, usePassword: true, username: r.id, password: r.pw, deviceId: 'phone', tid: r.tid,
                  monitoring: 2, locatorInterval: 30, moveModeLocatorInterval: 30, locatorDisplacement: 10, locatorPriority: 3, pubExtendedData: true, extendedData: true, cmd: true, remoteConfiguration: true };   // cmd＋remoteConfiguration：讓網站能切換值勤／退勤
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
    const link = 'owntracks:///config?inline=' + encodeURIComponent(b64);
    const o = overlay(`<h3>📱 ${self ? '我的定位設定' : '設定「' + esc(r.name) + '」'}<button class="sb x" data-close>完成</button></h3>
      ${self ? `<div class="hint" style="margin-bottom:6px">地圖上會顯示「${esc(r.name)}」${VAN(r.kind) ? '（橘色專車圖示）。請用<b>放在這台車上的手機</b>設定' : '和你的 LINE 大頭貼'}。值勤／退勤由管理員在網站切換。</div>` : ''}
      <div class="warn">⚠️ QR Code 裡有密碼，請不要截圖傳到群組。${self ? '之後再按「📱 我的QR」都會是同一組，換手機重掃即可。' : '之後在管理面板按「📱 QR」可以再叫出來。'}</div>

      <div class="quick"><div class="hint" style="margin-bottom:8px">已經裝好 OwnTracks、設定過的手機：按這個就切換完成</div>
        <a class="btn g big" href="${esc(link)}">📲 用這支手機定位</a>
        <div class="hint" style="margin-top:8px">跳出設定內容按右邊紅字「<b>Continue</b>」→ 上方模式選 <b>Move</b> 就好。</div></div>
      <button class="btn w" id="guide-t" style="margin-top:12px">📖 第一次使用？看安裝影片＋手冊</button>
      <div id="guide" class="hidden">
      <div class="vid"><div class="cht">🎬 跟著影片做（55 秒）</div>
        <video src="img/guide.mp4" poster="img/guide.jpg" controls playsinline preload="none"></video>
        <div class="hint">影片中間會切回 LINE 按綠色按鈕，你也照做就好。</div></div>

      <div class="hint" style="margin:10px 0 0">或看每一步的圖：</div>
      <div class="car"><div class="trk" id="trk">
        <div class="sl"><div class="slh"><b>1</b>下載 App<small>1/9</small></div><div class="slt">先到 App Store／Google Play 下載 <b>OwnTracks</b>（免費）。</div><div class="sli"><img src="img/p-app.jpg" alt="" style="max-width:320px;border-radius:14px"><div class="dl2" style="margin-top:8px"><a class="btn" href="https://apps.apple.com/app/id692424691" target="_blank" rel="noopener" style="background:#111827">iPhone 下載</a><a class="btn" href="https://play.google.com/store/apps/details?id=org.owntracks.android" target="_blank" rel="noopener" style="background:#15803d">Android 下載</a></div><div class="slt" style="text-align:center;margin-top:10px">裝好後<b>打開 App</b>，接著會一直跳出問題<br>照下一頁回答 →</div></div></div>
        <div class="sl"><div class="slh"><b>2</b>第一個問題：位置<small>2/9</small></div><div class="imp">⚠️ 這步一定要按對</div><div class="slt"><div class="see">手機跳出：<b>要允許「OwnTracks」使用你的位置嗎？</b></div><div class="tap"><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> 按「<b>使用 App 期間允許</b>」</div></div><div class="sli"><img src="img/p-loc.jpg" alt=""></div></div>
        <div class="sl"><div class="slh"><b>3</b>接著 4 個問題<small>3/9</small></div><div class="easy">👌 照著按就好</div><div class="slt"><span class="hint">順序可能不一樣，看標題對照：</span></div><div class="sli"><div class="g2"><figure><img src="img/p-motion.jpg" alt=""><figcaption>「動作與健身」<br><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> <b>允許</b></figcaption></figure><figure><img src="img/p-notif.jpg" alt=""><figcaption>「傳送通知」<br><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> <b>允許</b></figcaption></figure><figure><img src="img/p-mapi.jpg" alt=""><figcaption>「Map Interaction」<br><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> <b>Yes</b></figcaption></figure><figure><img src="img/p-geo.jpg" alt=""><figcaption>「Reverse Geocoding」<br><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> <b>No</b></figcaption></figure></div></div></div>
        <div class="sl"><div class="slh"><b>4</b>打開一個開關（只做一次）<small>4/9</small></div><div class="imp">⚠️ 這步一定要按對</div><div class="slt">讓 App 可以接收我們的設定。照順序點：</div><div class="sli"><div class="g2"><figure><img src="img/s2-i.jpg" alt=""><figcaption>① 左上角 <b>i</b></figcaption></figure><figure><img src="img/s2-settings.jpg" alt=""><figcaption>② 藍字 <b>Settings</b></figcaption></figure><figure><img src="img/s3-remote.jpg" alt=""><figcaption>③ 滑到最下面<br>點 <b>Remote Control</b></figcaption></figure><figure><img src="img/s4-allow.jpg" alt=""><figcaption>④ 打開第一個開關<br><b>Allow external configuration</b></figcaption></figure></div></div></div>
        <div class="sl"><div class="slh"><b>5</b>開關的警告<small>5/9</small></div><div class="imp">⚠️ 這步一定要按對</div><div class="slt"><div class="see">手機跳出：<b>Allow external configuration?</b></div><div class="tap"><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> 按「<b>Continue（右邊紅字）</b>」</div></div><div class="sli"><img src="img/p-allow-ok.jpg" alt=""></div></div>
        <div class="sl"><div class="slh"><b>6</b>回到這個網頁，匯入設定<small>6/9</small></div><div class="imp">⚠️ 這步一定要按對</div><div class="slt"><b>① 切回 LINE 這個網頁</b>，按下面綠色按鈕：</div><div class="sli"><a class="btn g" href="${esc(link)}" style="width:100%;max-width:340px">📲 用這支手機定位</a><div class="slt" style="width:100%;margin-top:10px"><b>② 會自動跳回 App</b>，手機跳出「Process Configuration」<br><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> 按「<b>Continue（右邊紅字）</b>」</div><img src="img/p-import.jpg" alt=""></div></div>
        <div class="sl"><div class="slh"><b>7</b>再 2 個視窗<small>7/9</small></div><div class="easy">👌 照著按就好</div><div class="slt">都按「<b>Continue</b>」</div><div class="sli"><div class="g2"><figure><img src="img/p-done.jpg" alt=""><figcaption>「openURL」<br><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> <b>Continue</b></figcaption></figure><figure><img src="img/p-setup.jpg" alt=""><figcaption>「Setup」<br><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> <b>Continue</b></figcaption></figure></div></div></div>
        <div class="sl"><div class="slh"><b>8</b>最後一個問題：背景位置<small>8/9</small></div><div class="imp">⚠️ 這步一定要按對</div><div class="slt"><div class="see">手機跳出：<b>在你未使用 App 時也可使用你的位置嗎？</b></div><div class="tap"><svg class="cur" viewBox="0 0 70 110" aria-hidden="true"><path d="M3 3v94l23-21 16 37 16-7-16-37h32z" fill="#111" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg> 按「<b>保留只在使用期間</b>」</div></div><div class="sli"><img src="img/p-always.jpg" alt=""></div></div>
        <div class="sl"><div class="slh"><b>9</b>完成 🎉<small>9/9</small></div><div class="slt">上方模式是 <b>Move</b> 就好了。<div class="seg"><span>Quiet</span><span>Manual</span><span>Significant</span><span class="on">Move</span></div><br>⚠️ 值勤時<b>不要把 OwnTracks 往上滑掉</b>（滑掉＝停止分享，重新打開就恢復）。</div><div class="sli"></div></div>
      </div><div class="cnav"><button class="sb" id="cprev">‹ 上一步</button><span id="cdots"></span><button class="sb" id="cnext">下一步 ›</button></div></div>
      </div>
      <h4>👥 幫別的手機設定（例如團員、車上的手機）</h4><div class="hint">用<b>那支手機的相機</b>掃這個 QR Code：</div>
      <div class="qr" id="qr"></div>
      <details style="margin-top:14px"><summary class="hint" style="cursor:pointer">手動設定（掃不到時才用）</summary>
      <div class="kv"><b>模式</b> HTTP<br><b>網址</b> ${esc(OT_URL)}<br><b>帳號</b> ${esc(r.id)}<br><b>密碼</b> ${esc(r.pw)}<br><b>裝置ID</b> phone　<b>代號</b> ${esc(r.tid)}</div></details>`);
    o.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => load()));
    let guideInit = false;
    o.querySelector('#guide-t').onclick = () => { const g = o.querySelector('#guide'), open = g.classList.toggle('hidden') === false;
      o.querySelector('#guide-t').textContent = open ? '📖 收起安裝手冊' : '📖 第一次使用？看安裝影片＋手冊';
      if (open && !guideInit) { guideInit = true;
    { const trk = o.querySelector('#trk'), rail = document.createElement('div'); rail.className = 'rail';
      while (trk.firstChild) rail.appendChild(trk.firstChild); trk.appendChild(rail);
      const n = rail.children.length, dots = o.querySelector('#cdots'); dots.innerHTML = '<i></i>'.repeat(n);
      let c = 0;
      const fit = () => { trk.style.height = rail.children[c].offsetHeight + 'px'; };
      const set = (i, anim = true) => { c = Math.max(0, Math.min(n - 1, i)); rail.style.transition = anim ? 'transform .3s ease' : 'none'; rail.style.transform = `translateX(${-c * 100}%)`;
        [...dots.children].forEach((d, k) => d.classList.toggle('on', k === c)); o.querySelector('#cprev').disabled = c <= 0; o.querySelector('#cnext').disabled = c >= n - 1; fit(); };
      o.querySelector('#cprev').onclick = () => set(c - 1); o.querySelector('#cnext').onclick = () => set(c + 1);
      // 自己處理滑動：先判斷方向，左右才換頁，上下就讓頁面捲動（不會兩個方向一起動）
      let x0 = 0, y0 = 0, dx = 0, lock = '';
      trk.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; lock = ''; }, { passive: true });
      trk.addEventListener('touchmove', e => { const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
        if (!lock && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(mx) > Math.abs(my) ? 'h' : 'v';
        if (lock !== 'h') return; e.preventDefault(); dx = mx; if ((c === 0 && dx > 0) || (c === n - 1 && dx < 0)) dx /= 3;
        rail.style.transition = 'none'; rail.style.transform = `translateX(calc(${-c * 100}% + ${dx}px))`; }, { passive: false });
      trk.addEventListener('touchend', () => { if (lock === 'h') set(Math.abs(dx) > 50 ? c + (dx < 0 ? 1 : -1) : c); lock = ''; });
      rail.querySelectorAll('img').forEach(im => im.addEventListener('load', fit));
      set(0, false); }
      } };
    try { new QRCode(o.querySelector('#qr'), { text: link, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L }); } catch (e) { o.querySelector('#qr').textContent = 'QR Code 產生失敗，請用下面的按鈕或手動設定'; }
  }

  // iPhone：擋掉整頁縮放手勢（地圖本身的縮放不受影響）
  document.addEventListener('gesturestart', e => { if (!e.target.closest('#map')) e.preventDefault(); }, { passive: false });
  await load(); start();
</script>
