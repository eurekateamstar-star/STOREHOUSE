<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>團員定位｜白沙屯拱天宮醫護團</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --primary:#D65A68; --accent:#F08339; --ink:#1f2430; --sub:#6b7280; --line:#e5e7eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif; color:var(--ink); background:#f6f6f8; }
  .hidden { display:none !important; }
  #map { position:fixed; inset:0; z-index:1; }
  .top { position:fixed; z-index:500; top:calc(env(safe-area-inset-top) + 10px); left:10px; right:10px; display:flex; gap:8px; align-items:center;
         background:rgba(255,255,255,.95); border-radius:16px; padding:8px 10px; box-shadow:0 4px 18px rgba(0,0,0,.12); }
  .top .t { flex:1; min-width:0; }
  .top h1 { margin:0; font-size:16px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:430px) { .top { gap:5px; padding:8px; } .ib { padding:8px 8px; font-size:12.5px; } .top h1 { font-size:15px; } }
  .top .s { font-size:11.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-right:4px; vertical-align:middle; }
  .dot.err { background:var(--red); }
  .ib { border:0; background:#f3f4f6; border-radius:12px; padding:8px 10px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink); white-space:nowrap; }
  .ib.on { background:var(--blue); color:#fff; }
  .ib.p { background:var(--primary); color:#fff; }

  /* 底部清單 */
  .sheet { position:fixed; z-index:500; left:0; right:0; bottom:0; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.14);
           max-height:46vh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); transition:max-height .2s; }
  .sheet.min { max-height:64px; }
  .sh-h { display:flex; align-items:center; gap:8px; padding:10px 14px 8px; cursor:pointer; }
  .sh-h .grab { position:absolute; left:50%; top:5px; width:38px; height:4px; margin-left:-19px; border-radius:4px; background:#d1d5db; }
  .sh-h b { font-size:15px; }
  .sh-h .cnt { font-size:12px; color:var(--sub); flex:1; }
  .filters { display:flex; gap:6px; padding:0 14px 8px; overflow-x:auto; }
  .chip { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:4px 11px; font:inherit; font-size:12.5px; font-weight:700; white-space:nowrap; cursor:pointer; }
  .chip.on { border-color:var(--ink); background:var(--ink); color:#fff; }
  .list { overflow-y:auto; padding:0 8px 10px; }
  .row { display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:12px; cursor:pointer; }
  .row:active, .row.sel { background:#f3f4f6; }
  .row .e { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; flex:none; }
  .row .m { flex:1; min-width:0; }
  .row .n { font-weight:800; font-size:14.5px; }
  .row .d { font-size:12px; color:var(--sub); }
  .row .r { text-align:right; font-size:12px; color:var(--sub); white-space:nowrap; }
  .row .r .ago { font-weight:800; color:var(--green); font-size:13px; }
  .row.stale .ago { color:var(--amber); }
  .row.off { opacity:.5; }
  .row.off .ago { color:var(--sub); }
  .duty { border:0; border-radius:99px; padding:5px 10px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; margin-left:6px; white-space:nowrap; }
  .duty.on { background:#dcfce7; color:#15803d; } .duty.off { background:#f3f4f6; color:#6b7280; }
  .bar2 { display:flex; gap:8px; margin:8px 0 4px; } .bar2 .sb { flex:1; padding:10px; font-size:13.5px; }

  /* 地圖標記 */
  .mk { position:relative; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; pointer-events:auto; }
  .mk .b { width:38px; height:38px; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center; font-size:19px; box-shadow:0 3px 10px rgba(0,0,0,.3); }
  .mk .tip { width:0; height:0; border:7px solid transparent; border-top-color:#fff; margin-top:-2px; }
  .mk .l { position:absolute; top:100%; margin-top:-2px; white-space:nowrap; background:rgba(255,255,255,.95); border-radius:8px; padding:1px 7px; font-size:12px; font-weight:800; box-shadow:0 1px 5px rgba(0,0,0,.2); }
  .mk .l .tm { background:#c2414f; color:#fff; border-radius:5px; padding:0 4px; margin-right:4px; font-size:11px; }
  .mk .l small { font-weight:600; color:var(--sub); margin-left:3px; }
  .mk.stale .b { filter:grayscale(1); opacity:.65; }
  .av { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .mk .b.p { padding:0; overflow:hidden; border-width:3px; }
  .row .e.p { padding:0; overflow:hidden; border:2.5px solid #fff; box-shadow:0 0 0 2px var(--kc,#9ca3af); }
  .it .pic { width:30px; height:30px; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:4px; }
  .mk.stale .l { color:var(--sub); }
  .k-小組長 { background:#2563eb; } .k-指揮車 { background:#dc2626; } .k-物資車 { background:#d97706; } .k-其他 { background:#6b7280; }
  .row .e.k-小組長 { background:#dbeafe; } .row .e.k-指揮車 { background:#fee2e2; } .row .e.k-物資車 { background:#fef3c7; } .row .e.k-其他 { background:#f3f4f6; }
  .me-dot { width:16px; height:16px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 6px rgba(37,99,235,.25); transform:translate(-50%,-50%); }

  /* 全頁訊息 */
  .msg { position:fixed; inset:0; z-index:900; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(160deg,#fff7ed,#fef2f2 60%,#fff); }
  .msg .c { max-width:380px; width:100%; background:#fff; border-radius:20px; padding:26px 20px; text-align:center; box-shadow:0 10px 36px rgba(214,90,104,.15); }
  .msg .ic { font-size:44px; }
  .msg h2 { margin:8px 0 6px; font-size:19px; }
  .msg p { color:#4b5563; font-size:14.5px; line-height:1.7; margin:0 0 14px; }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:13px; font:inherit; font-size:15.5px; font-weight:800; cursor:pointer; background:var(--primary); color:#fff; text-decoration:none; text-align:center; }
  .btn.g { background:#06c755; } .btn.w { background:#f3f4f6; color:var(--ink); }
  .btn + .btn { margin-top:8px; }

  /* 管理面板 */
  .ov { position:fixed; inset:0; z-index:800; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; }
  .pn { background:#fff; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width:700px) { .ov { align-items:center; } .pn { border-radius:20px; } }
  .pn h3 { margin:0 0 4px; font-size:18px; display:flex; align-items:center; gap:8px; }
  .pn h3 .x { margin-left:auto; }
  .pn h4 { margin:18px 0 8px; font-size:14.5px; }
  .pn .hint { font-size:12.5px; color:var(--sub); line-height:1.6; }
  .it { display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:12px; margin-bottom:6px; }
  .it .m { flex:1; min-width:0; font-size:14px; }
  .it.tk { flex-wrap:wrap; } .it.tk .m { flex:1 1 100%; } .it.tk .duty { margin-left:0; margin-right:auto; }
  .it .m small { display:block; color:var(--sub); font-size:12px; }
  .sb { border:0; border-radius:10px; padding:6px 9px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; background:#f3f4f6; }
  .sb.d { background:#fee2e2; color:var(--red); }
  .fm { display:grid; gap:8px; background:#f9fafb; border-radius:14px; padding:12px; }
  .fm label { font-size:12.5px; font-weight:700; color:#374151; }
  .fm input, .fm select { width:100%; padding:10px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:15px; background:#fff; }
  .qr { display:flex; justify-content:center; padding:12px; background:#fff; border:1px solid var(--line); border-radius:14px; margin:10px 0; }
  .kv { font-size:13px; background:#f9fafb; border-radius:12px; padding:10px 12px; line-height:1.9; word-break:break-all; }
  .kv b { display:inline-block; min-width:56px; color:var(--sub); font-weight:700; }
  .warn { background:#fff7ed; border:1.5px dashed #fdba74; color:#9a3412; border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.6; margin:8px 0; }
  ol.st { padding-left:20px; margin:6px 0; font-size:13.5px; line-height:1.75; }
  .toast { position:fixed; z-index:2000; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(17,24,39,.92); color:#fff; padding:9px 16px; border-radius:99px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .leaflet-top { top:calc(env(safe-area-inset-top) + 64px); }
</style>
</head>
<body>
<div id="map"></div>

<div class="top hidden" id="top">
  <div class="t"><h1>團員定位</h1><div class="s" id="status">載入中…</div></div>
  <button class="ib" id="b-fit" title="顯示全部">全部</button>
  <button class="ib" id="b-me" title="我的位置">🧭</button>
  <button class="ib hidden" id="b-qr" title="我的 OwnTracks 設定 QR Code">📱 我的QR</button>
  <button class="ib p hidden" id="b-admin">⚙️ 管理</button>
</div>

<div class="sheet hidden" id="sheet">
  <div class="sh-h" id="sh-h"><span class="grab"></span><b>位置清單</b><span class="cnt" id="cnt"></span><span id="sh-arrow">▾</span></div>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
</div>

<div class="msg" id="msg"><div class="c"><div class="ic">⏳</div><h2>載入中</h2><p>正在確認登入狀態…</p></div></div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, inMemoryPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // 和團員專區同一個 Firebase、同一個網域 → 在團員專區登入過就直接是登入狀態
  const app = initializeApp({
    apiKey: "AIzaSyA_5hmnIBCeLszWW8kIjgOZelv-c6-ALfY",
    authDomain: "linebot-firebase-b1242.firebaseapp.com",
    projectId: "linebot-firebase-b1242",
    storageBucket: "linebot-firebase-b1242.firebasestorage.app",
    messagingSenderId: "1002268658683",
    appId: "1:1002268658683:web:739adcd7819f8c9393595e"
  });
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const auth = initializeAuth(app, { persistence: isIOS ? [browserLocalPersistence, inMemoryPersistence] : [indexedDBLocalPersistence, browserLocalPersistence, inMemoryPersistence] });

  const W = 'https://bst-auth.eurekateamstar.workers.dev';
  const OT_URL = W + '/owntracks';
  const MEMBER_LIFF = 'https://liff.line.me/2011820105-x1KU6xLW?go=locate';
  const POLL = 15e3, STALE = 3 * 60e3;
  const KINDS = ['小組長', '指揮車', '物資車', '其他'];
  const EMOJI = { 小組長: '🙋', 指揮車: '🚩', 物資車: '🚚', 其他: '📍' };

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const toast = (t, ms = 2200) => { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), ms); };
  const ago = (ms, now) => { const s = Math.max(0, (now - ms) / 1000); if (s < 60) return '剛剛'; if (s < 3600) return Math.floor(s / 60) + ' 分鐘前';
    const d = new Date(ms); return (s < 86400 ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  function msg(ic, title, text, btns = '') { $('msg').innerHTML = `<div class="c"><div class="ic">${ic}</div><h2>${title}</h2><p>${text}</p>${btns}</div>`; $('msg').classList.remove('hidden'); }

  // ---------- 登入 ----------
  const user = await Promise.race([new Promise(r => { const off = onAuthStateChanged(auth, u => { if (u) { off(); r(u); } }); }), new Promise(r => setTimeout(() => r(auth.currentUser), 6000))]);
  if (!user) {
    msg('🔐', '請先登入團員專區', '定位地圖要用團員帳號查看。<br>請從 LINE 選單打開「團員專區」，再按「📍 團員定位」。',
      `<a class="btn g" href="${MEMBER_LIFF}">用 LINE 登入團員專區</a>`);
    throw new Error('not signed in');
  }

  // ---------- 地圖 ----------
  const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([24.5640, 120.7055], 14);   // 預設：白沙屯拱天宮附近
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  const marks = new Map(), circles = new Map();
  let items = [], mgr = false, sess = '', now = Date.now(), firstFit = true, filter = '全部', selId = '';

  async function api(path, body) {
    const r = await fetch(W + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({})); if (!r.ok && !j.error) j.error = '伺服器回應 ' + r.status; j._status = r.status; return j;
  }
  async function load() {
    let j;
    try { j = await api('/loc', { sess, idToken: await user.getIdToken() }); }
    catch (e) { setStatus(false, '連線失敗，稍後自動重試'); return; }
    if (j._status === 403 && j.canSelf && !load.triedSelf) { load.triedSelf = true; if (await myQR(true)) return; }
    if (j._status === 403) { msg('🙅', '沒有查看權限', esc(j.error || '') + '<br><br>需要的話請找完整管理員把你加入「可查看的人」。', `<a class="btn w" href="../member/">回團員專區</a>`); stop(); return; }
    if (j.error) { setStatus(false, j.error); return; }
    $('msg').classList.add('hidden'); $('top').classList.remove('hidden'); $('sheet').classList.remove('hidden');
    if (j.sess) sess = j.sess;
    items = j.items || []; mgr = !!j.mgr; now = j.now || Date.now();
    $('b-admin').classList.toggle('hidden', !mgr);
    $('b-qr').classList.toggle('hidden', !j.canSelf);
    if (j.selfNeed && !load.autoQR) { load.autoQR = true; setTimeout(() => myQR(true), 300); }   // 小組長第一次打開：直接給 QR Code
    const on = items.filter(i => i.loc).length;
    setStatus(true, `即時更新中 · ${on}/${items.length} 台有位置 · ${new Date().toTimeString().slice(0, 5)}`);
    draw();
  }
  function setStatus(ok, t) { $('status').innerHTML = `<span class="dot ${ok ? '' : 'err'}"></span>${esc(t)}`; }
  let timer = null;
  const start = () => { if (!timer) timer = setInterval(() => { if (document.visibilityState === 'visible') load(); }, POLL); };
  const stop = () => { clearInterval(timer); timer = null; };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });

  function iconFor(i) {
    const st = now - i.loc.at > STALE;
    const tag = st ? `<small>${esc(ago(i.loc.tst, now))}</small>` : '';
    return L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="mk ${st ? 'stale' : ''}"><div class="b k-${esc(i.kind)} ${i.pic ? 'p' : ''}" style="${i.pic ? 'border-color:' + KC[i.kind] : ''}">${face(i)}</div><div class="tip" style="${i.pic ? 'border-top-color:' + KC[i.kind] : ''}"></div><div class="l">${i.team ? `<span class="tm">${esc(i.team)}</span>` : ''}${esc(i.name)}${tag}</div></div>` });
  }
  function popup(i) {
    const l = i.loc, bits = [];
    bits.push(`<b style="font-size:15px">${i.pic ? '' : (EMOJI[i.kind] || '') + ' '}${esc(label(i))}</b>`);
    bits.push(esc(sub(i)));
    bits.push(`更新：${esc(ago(l.tst, now))}`);
    if (l.vel != null && l.vel >= 2) bits.push(`速度：約 ${Math.round(l.vel)} km/h`);
    if (l.batt != null) bits.push(`手機電量：${l.batt}%${l.batt <= 20 ? ' ⚠️' : ''}`);
    if (l.acc != null) bits.push(`誤差：約 ${Math.round(l.acc)} 公尺`);
    bits.push(`<a href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lon}" target="_blank" rel="noopener">🧭 Google 導航過去</a>`);
    return bits.join('<br>');
  }
  const shown = i => filter === '全部' || i.kind === filter || sideOf(i) === filter;
  const KC = { 小組長: '#2563eb', 指揮車: '#dc2626', 物資車: '#d97706', 其他: '#6b7280' };
  const face = i => i.pic ? `<img class="av" src="${esc(i.pic)}" referrerpolicy="no-referrer" alt="" onerror="this.replaceWith(document.createTextNode('${EMOJI[i.kind] || '📍'}'))">` : (EMOJI[i.kind] || '📍');
  const label = i => (i.team ? i.team + ' ' : '') + i.name;
  const LO = l => { const m = /^轎(前|後)(\d+)/.exec(l || ''); return !m ? 999 : m[1] === '前' ? 100 - +m[2] : 200 + +m[2]; };   // 轎前（大到小）→ 轎後（小到大）
  const sideOf = i => /^轎前/.test(i.team || '') ? '轎前' : /^轎後/.test(i.team || '') ? '轎後' : '';
  const sub = i => [i.kind, i.uname && i.uname !== i.name ? i.uname : ''].filter(Boolean).join('・');
  const MODE = { 2: 'Move 即時', 1: 'Significant 省電', 0: 'Manual 手動', '-1': 'Quiet 停止' };
  const modeTxt = (i) => i.mode == null ? '' : (i.duty !== false && i.mode !== 2) || (i.duty === false && i.mode === 2) ? '手機切換中…' : 'App：' + (MODE[i.mode] || i.mode);
  async function setDuty(body) {
    const r = await adm('duty', body); if (r.error) { toast(r.error); return false; }
    toast(body.on ? '✅ 已設為值勤，手機下次連線時開始即時分享' : '🌙 已設為退勤，地圖不再顯示，手機下次連線時改成省電');
    await load(); return true;
  }
  function draw() {
    const seen = new Set();
    for (const i of items) {
      if (!i.loc || !shown(i)) continue; seen.add(i.id);
      const ll = [i.loc.lat, i.loc.lon];
      let m = marks.get(i.id);
      if (!m) { m = L.marker(ll, { icon: iconFor(i) }).addTo(map).bindPopup('', { offset: [0, -40] }); m.on('click', () => sel(i.id, false)); marks.set(i.id, m); }
      else { m.setLatLng(ll); m.setIcon(iconFor(i)); }
      m.setPopupContent(popup(i));
      let c = circles.get(i.id);
      if (i.loc.acc && i.loc.acc < 300) { if (!c) { c = L.circle(ll, { radius: i.loc.acc, weight: 1, opacity: .4, fillOpacity: .08 }).addTo(map); circles.set(i.id, c); } else c.setLatLng(ll).setRadius(i.loc.acc); }
      else if (c) { c.remove(); circles.delete(i.id); }
    }
    for (const [id, m] of marks) if (!seen.has(id)) { m.remove(); marks.delete(id); const c = circles.get(id); if (c) { c.remove(); circles.delete(id); } }
    if (firstFit && seen.size) { firstFit = false; fitAll(); }
    renderList();
  }
  function fitAll() {
    const pts = items.filter(i => i.loc && shown(i)).map(i => [i.loc.lat, i.loc.lon]);
    if (meLL) pts.push(meLL);
    if (pts.length === 1) map.setView(pts[0], 16); else if (pts.length) map.fitBounds(pts, { paddingTopLeft: [40, 90], paddingBottomRight: [40, ($('sheet').offsetHeight || 0) + 30], maxZoom: 17 });
  }
  function renderList() {
    const cnt = k => items.filter(i => k === '全部' || i.kind === k || sideOf(i) === k).length;
    const ic = { 轎前: '⬆️', 轎後: '⬇️' };
    $('filters').innerHTML = ['全部', '轎前', '轎後', ...KINDS].filter(k => k === '全部' || cnt(k)).map(k => `<button class="chip ${k === filter ? 'on' : ''}" data-f="${k}">${k === '全部' ? '全部' : (ic[k] || EMOJI[k]) + ' ' + k} ${cnt(k)}</button>`).join('');
    $('filters').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); fitAll(); });
    const L2 = items.filter(shown).sort((a, b) => ((a.duty === false) - (b.duty === false)) || (!!b.loc - !!a.loc) || (LO(a.team) - LO(b.team)) || (KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind)) || a.name.localeCompare(b.name, 'zh-Hant'));
    $('cnt').textContent = `${items.filter(i => i.loc && now - i.loc.at <= STALE).length} 台即時・${items.filter(i => i.duty !== false).length} 台值勤・共 ${items.length} 台`;
    $('list').innerHTML = L2.length ? L2.map(i => {
      const l = i.loc, st = l && now - l.at > STALE;
      return `<div class="row ${!l ? 'off' : st ? 'stale' : ''} ${i.id === selId ? 'sel' : ''}" data-id="${esc(i.id)}">
        <div class="e k-${esc(i.kind)} ${i.pic ? 'p' : ''}" style="--kc:${KC[i.kind]}">${face(i)}</div>
        <div class="m"><div class="n">${esc(label(i))}</div><div class="d">${esc(sub(i))}${l && l.batt != null ? `・🔋${l.batt}%` : ''}${l && l.vel >= 2 ? `・${Math.round(l.vel)} km/h` : ''}</div></div>
        <div class="r">${i.duty === false ? `<div class="ago" style="color:#6b7280">🌙 退勤</div>不顯示位置` : l ? `<div class="ago">${esc(ago(l.tst, now))}</div>${st ? '訊號中斷' : '即時'}` : '<div class="ago">尚未連線</div>12 小時內沒有位置'}</div>
        ${mgr ? `<button class="duty ${i.duty === false ? 'off' : 'on'}" data-duty="${esc(i.id)}">${i.duty === false ? '退勤' : '值勤'}</button>` : ''}</div>`;
    }).join('') : `<div class="hint" style="padding:14px;text-align:center;color:#6b7280">${mgr ? '還沒有任何裝置，按右上「⚙️ 管理」新增' : '目前沒有裝置'}</div>`;
    $('list').querySelectorAll('[data-id]').forEach(r => r.onclick = () => sel(r.dataset.id, true));
    $('list').querySelectorAll('[data-duty]').forEach(b => b.onclick = e => { e.stopPropagation(); const i = items.find(x => x.id === b.dataset.duty);
      const on = i.duty === false; if (!on && !confirm(`「${i.name}」退勤？地圖會先清掉他的位置。`)) return; setDuty({ id: i.id, on }); });
  }
  function sel(id, fly) {
    selId = id; const i = items.find(x => x.id === id); renderList();
    if (!i || !i.loc) { toast(i && i.duty === false ? '這台目前是退勤' : '這台目前沒有位置'); return; }
    if (fly) { map.flyTo([i.loc.lat, i.loc.lon], Math.max(map.getZoom(), 16), { duration: .6 }); const m = marks.get(id); if (m) setTimeout(() => m.openPopup(), 650); }
  }
  $('sh-h').onclick = () => { $('sheet').classList.toggle('min'); $('sh-arrow').textContent = $('sheet').classList.contains('min') ? '▴' : '▾'; };
  $('b-fit').onclick = () => { filter = '全部'; draw(); fitAll(); };

  // 我的位置（只顯示在自己的畫面，不會上傳）
  let meWatch = null, meMark = null, meLL = null;
  $('b-me').onclick = () => {
    if (meWatch !== null) { navigator.geolocation.clearWatch(meWatch); meWatch = null; meMark && meMark.remove(); meMark = null; meLL = null; $('b-me').classList.remove('on'); return; }
    if (!navigator.geolocation) { toast('這個瀏覽器不能定位'); return; }
    $('b-me').classList.add('on'); let first = true;
    meWatch = navigator.geolocation.watchPosition(p => {
      meLL = [p.coords.latitude, p.coords.longitude];
      if (!meMark) meMark = L.marker(meLL, { icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="me-dot"></div>' }), zIndexOffset: 1000 }).addTo(map).bindPopup('我的位置（只有你看得到）');
      else meMark.setLatLng(meLL);
      if (first) { first = false; map.flyTo(meLL, Math.max(map.getZoom(), 16), { duration: .6 }); }
    }, e => { toast(e.code === 1 ? '請允許瀏覽器使用位置' : '無法取得位置'); $('b-me').classList.remove('on'); meWatch = null; }, { enableHighAccuracy: true, maximumAge: 10e3 });
  };

  // ---------- 小組長：自己的 OwnTracks QR Code（點開就產生，同一個人每次都是同一組）----------
  async function myQR(auto) {
    let r; try { r = await api('/loc-self', { idToken: await user.getIdToken() }); } catch (e) { if (!auto) toast('連線失敗'); return false; }
    if (r.error) { if (!auto) toast(r.error, 3500); return false; }
    $('msg').classList.add('hidden');
    showConfig({ ...r, name: (r.team ? r.team + ' ' : '') + r.name }, true);
    return true;
  }
  $('b-qr').onclick = () => myQR(false);

  // ---------- 管理（完整管理員、開發者）----------
  let members = null;
  const adm = async (op, extra = {}) => api('/loc-admin', { idToken: await user.getIdToken(), op, ...extra });
  function overlay(html) { const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="pn">${html}</div>`; document.body.appendChild(o);
    o.onclick = e => { if (e.target === o) o.remove(); }; o.querySelectorAll('[data-close]').forEach(b => b.onclick = () => o.remove()); return o; }
  async function loadMembers() { if (members) return members; const j = await adm('members'); members = j.members || []; return members; }
  const memberOpts = (sel = '') => `<option value="">（不綁定）</option>` + (members || []).map(m => `<option value="${esc(m.uid)}" ${m.uid === sel ? 'selected' : ''}>${esc(m.name)}</option>`).join('');

  $('b-admin').onclick = openAdmin;
  async function openAdmin() {
    const o = overlay(`<h3>⚙️ 定位管理<button class="sb x" data-close>關閉</button></h3><div class="hint">載入中…</div>`);
    const [st] = await Promise.all([adm('state'), loadMembers().catch(() => [])]);
    if (st.error) { o.querySelector('.hint').textContent = st.error; return; }
    const tk = st.trackers.sort((a, b) => KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind) || a.name.localeCompare(b.name, 'zh-Hant'));
    o.querySelector('.pn').innerHTML = `
      <h3>⚙️ 定位管理<button class="sb x" data-close>關閉</button></h3>
      <div class="hint">小組長、指揮車、物資車的手機各裝一個 OwnTracks App，在這裡新增裝置後掃 QR Code 就會自動設定好。</div>
      <h4>📱 裝置（${tk.length}）</h4>
      <div class="bar2"><button class="sb" id="all-on" style="background:#dcfce7;color:#15803d">✅ 全部值勤</button><button class="sb" id="all-off">🌙 全部退勤</button></div>
      <div class="hint" style="margin-bottom:8px">值勤＝手機每 30 秒回報（Move）；退勤＝地圖不顯示，手機改成省電模式（Significant）。<br>切換要等手機下次連線才生效：值勤→退勤約 30 秒；退勤→值勤可能要等手機移動一段距離（幾分鐘）。</div>
      ${tk.map(t => `<div class="it tk"><div class="m">${t.pic ? `<img class="pic" src="${esc(t.pic)}" referrerpolicy="no-referrer" alt="">` : EMOJI[t.kind] || ''} <b>${esc(t.name)}</b>${t.self ? ' <span class="hint">（組長自己產生）</span>' : ''}
          <small>${esc(t.kind)}${t.uname ? '・綁定 ' + esc(t.uname) : ''}・${t.ping ? '最後連線 ' + esc(ago(t.ping, Date.now())) : t.last ? '最後上傳 ' + esc(ago(t.last, Date.now())) : '還沒收到位置'}${modeTxt(t) ? '・' + esc(modeTxt(t)) : ''}</small></div>
          <button class="duty ${t.duty === false ? 'off' : 'on'}" data-d="${esc(t.id)}">${t.duty === false ? '🌙 退勤' : '✅ 值勤'}</button>
          <button class="sb" data-edit="${esc(t.id)}">編輯</button><button class="sb" data-qr="${esc(t.id)}">📱 QR</button><button class="sb d" data-del="${esc(t.id)}">刪除</button></div>`).join('') || '<div class="hint">還沒有裝置</div>'}
      <h4>➕ 新增裝置</h4>
      <div class="fm">
        <div><label>名稱（地圖上顯示）</label><input id="a-name" maxlength="20" placeholder="例如：第一組 王小明、指揮車、物資車 1 號"></div>
        <div><label>類型</label><select id="a-kind">${KINDS.map(k => `<option>${k}</option>`).join('')}</select></div>
        <div><label>綁定團員（選填，綁定後顯示他的 LINE 大頭貼）</label><select id="a-uid">${memberOpts()}</select></div>
        <button class="btn" id="a-add">新增並產生設定 QR Code</button>
      </div>
      <h4>👀 誰在看地圖（近 3 天）</h4>
      <div class="hint" style="margin-bottom:6px">已開通的團員都能看地圖。綠點＝正在看（1 分鐘內有更新）。</div>
      ${(st.watchers || []).map(w => { const live = Date.now() - w.last < 60e3; return `<div class="it"><div class="m"><b>${live ? '<span class="dot"></span>' : ''}${esc(w.name || '（未知）')}</b>
        <small>${live ? '正在看' : '最後 ' + esc(ago(w.last, Date.now()))}${w.day === new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10) ? `・今天從 ${new Date(w.first).toTimeString().slice(0, 5)} 開始・更新 ${w.n} 次` : ''}</small></div></div>`; }).join('') || '<div class="hint">還沒有人看過</div>'}`;
    o.querySelectorAll('[data-close]').forEach(b => b.onclick = () => o.remove());
    const again = () => { o.remove(); openAdmin(); load(); };
    o.querySelector('#all-on').onclick = async () => { if (await setDuty({ all: true, on: true })) again(); };
    o.querySelector('#all-off').onclick = async () => { if (!confirm('全部裝置退勤？地圖會清掉所有位置。')) return; if (await setDuty({ all: true, on: false })) again(); };
    o.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { const t = tk.find(x => x.id === b.dataset.d); if (await setDuty({ id: t.id, on: t.duty === false })) again(); });
    o.querySelector('#a-add').onclick = async () => {
      const name = o.querySelector('#a-name').value.trim(); if (!name) { toast('請填名稱'); return; }
      const uid = o.querySelector('#a-uid').value, mm = members.find(m => m.uid === uid) || {};
      const r = await adm('add', { name, kind: o.querySelector('#a-kind').value, uid, uname: mm.name || '', pic: mm.pic || '', rkey: mm.rkey || '' });
      if (r.error) { toast(r.error); return; }
      o.remove(); showConfig(r); load();
    };
    o.querySelectorAll('[data-qr]').forEach(b => b.onclick = async () => {
      const r = await adm('qr', { id: b.dataset.qr }); if (r.error) { toast(r.error); return; } o.remove(); showConfig(r);
    });
    o.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const t = tk.find(x => x.id === b.dataset.del); if (!confirm(`刪除「${t.name}」？這台手機之後上傳的位置都會被拒絕。`)) return;
      const r = await adm('del', { id: t.id }); if (r.error) { toast(r.error); return; } toast('已刪除'); again();
    });
    o.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      const t = tk.find(x => x.id === b.dataset.edit);
      const e = overlay(`<h3>編輯裝置<button class="sb x" data-close>取消</button></h3><div class="fm">
        <div><label>名稱</label><input id="e-name" maxlength="20" value="${esc(t.name)}"></div>
        <div><label>類型</label><select id="e-kind">${KINDS.map(k => `<option ${k === t.kind ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
        <div><label>綁定團員</label><select id="e-uid">${memberOpts(t.uid)}</select></div>
        <button class="btn" id="e-save">儲存</button></div>
        <h4>🔑 換新密碼</h4><div class="hint">手機遺失時用：舊設定立刻失效，新手機要重掃 QR Code。</div><button class="btn w" id="e-reset" style="margin-top:8px">換新密碼並顯示 QR Code</button>`);
      e.querySelector('#e-reset').onclick = async () => { if (!confirm('換新密碼後，原本那支手機就不能再回報了。確定？')) return;
        const r = await adm('reset', { id: t.id }); if (r.error) { toast(r.error); return; } e.remove(); o.remove(); showConfig(r); };
      e.querySelector('#e-save').onclick = async () => {
        const uid = e.querySelector('#e-uid').value, mm = members.find(m => m.uid === uid) || {};
        const r = await adm('edit', { id: t.id, name: e.querySelector('#e-name').value.trim(), kind: e.querySelector('#e-kind').value, uid, uname: mm.name || '', pic: mm.pic || '', rkey: mm.rkey || '' });
        if (r.error) { toast(r.error); return; } e.remove(); toast('已儲存'); again();
      };
    });

  }

  // OwnTracks 設定：QR Code（手機相機掃）、直接開啟、下載設定檔、手動輸入
  function showConfig(r, self) {
    const cfg = { _type: 'configuration', mode: 3, url: OT_URL, auth: true, usePassword: true, username: r.id, password: r.pw, deviceId: 'phone', tid: r.tid,
                  monitoring: 2, locatorInterval: 30, moveModeLocatorInterval: 30, locatorDisplacement: 10, locatorPriority: 3, pubExtendedData: true, extendedData: true, cmd: true, remoteConfiguration: true };   // cmd＋remoteConfiguration：讓網站能切換值勤／退勤
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
    const link = 'owntracks:///config?inline=' + encodeURIComponent(b64);
    const o = overlay(`<h3>📱 ${self ? '我的定位設定' : '設定「' + esc(r.name) + '」'}<button class="sb x" data-close>完成</button></h3>
      ${self ? `<div class="hint" style="margin-bottom:6px">地圖上會顯示「${esc(r.name)}」和你的 LINE 大頭貼。值勤／退勤由管理員在網站切換。</div>` : ''}
      <div class="warn">⚠️ QR Code 裡有密碼，請不要截圖傳到群組。${self ? '之後再按「📱 我的QR」都會是同一組，換手機重掃即可。' : '之後在管理面板按「📱 QR」可以再叫出來。'}</div>
      <ol class="st">
        <li>在要定位的手機安裝 OwnTracks：<a href="https://apps.apple.com/app/id692424691" target="_blank" rel="noopener">iPhone</a>／<a href="https://play.google.com/store/apps/details?id=org.owntracks.android" target="_blank" rel="noopener">Android</a></li>
        <li>打開 OwnTracks，位置權限選「<b>永遠允許</b>」（Android 也要關掉這個 App 的電池最佳化）</li>
        <li><b>第一次要先開一個開關</b>（每支手機做一次就好）：OwnTracks 左上角 <b>i</b> → 藍字 <b>Settings</b> → 滑到最下面點 <b>Remote Control</b> → 打開最上面的「<b>Allow external configuration</b>」，跳出警告按確定（其他開關不要動）。<br><span class="hint">沒開的話掃了會出現「URI or file configuration not allowed」。</span></li>
        <li>用那支手機的<b>相機</b>掃下面的 QR Code，選用 OwnTracks 開啟、按「匯入／Import」。</li>
        <li>回到 OwnTracks 的 <b>Map</b>，上方模式選「<b>Move</b>」。之後值勤／退勤由管理員在網站切換，不用再自己按。<br><span class="hint">成功的話：i → Status Info 的 Parameters 會變成 https://bst-auth… 開頭。</span></li>
      </ol>
      <div class="qr" id="qr"></div>
      <a class="btn g" href="${esc(link)}">在這支手機直接開啟 OwnTracks 設定</a>
      <h4>手動設定（掃不到時）</h4>
      <div class="kv"><b>模式</b> HTTP<br><b>網址</b> ${esc(OT_URL)}<br><b>帳號</b> ${esc(r.id)}<br><b>密碼</b> ${esc(r.pw)}<br><b>裝置ID</b> phone　<b>代號</b> ${esc(r.tid)}</div>`);
    o.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => load()));
    try { new QRCode(o.querySelector('#qr'), { text: link, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L }); } catch (e) { o.querySelector('#qr').textContent = 'QR Code 產生失敗，請用下面的按鈕或手動設定'; }
  }

  await load(); start();
</script>
</body>
</html>
