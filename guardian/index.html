<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全民醫護證｜白沙屯拱天宮醫護團</title>
<meta property="og:title" content="全民醫護證｜白沙屯拱天宮醫護團">
<meta property="og:description" content="不用證照，也能守護身邊的人。領一張屬於你的全民醫護證！">
<meta property="og:image" content="https://tsushin-buishatun.pages.dev/richmenu/guardian-promo.jpg">

<style>
  :root{--red:#E2231A;--red2:#C8161D;--ink:#1B1B1B;--sub:#6E625C;--paper:#FBF5EC;--cream:#FFFCF7;--line:#E2231A}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%;
    background:var(--paper) radial-gradient(rgba(170,120,80,.06) 1px,transparent 1.5px) 0 0/6px 6px}
  .wrap{max-width:480px;margin:0 auto;padding:0 0 112px}
  .hidden{display:none!important}
  /* 上方紅色字帶（跟證件一樣） */
  .band{position:sticky;top:0;z-index:30;height:40px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:12.5px;font-weight:800;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
  .band::before,.band::after{content:"";width:46px;height:16px;flex:none;background:repeating-conic-gradient(#fff 0 25%,transparent 0 50%) 0 0/16px 16px}
  .band i{font-style:normal;opacity:.7}
  .hero{position:relative}
  .hero img{display:block;width:100%}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(rgba(251,245,236,0),var(--paper))}
  .sheet{position:relative;margin:-30px 14px 0;z-index:2}
  /* 外框：跟證件資料卡一樣的紅框白底 */
  .frame{background:var(--cream);border:3px solid var(--red);border-radius:18px;padding:14px 14px 16px;box-shadow:0 6px 0 rgba(226,35,26,.10)}
  .ttl{display:flex;align-items:center;gap:10px;justify-content:center}
  .ttl::before,.ttl::after{content:"";flex:1;max-width:84px;height:22px;background:repeating-conic-gradient(#1b1b1b 0 25%,#fff 0 50%) 0 0/16px 16px;border:2px solid #1b1b1b}
  .ttl b{font-size:27px;font-weight:900;color:var(--red);letter-spacing:3px}
  .en{text-align:center;font-size:11.5px;letter-spacing:5px;color:#3a3330;margin-top:2px}
  .lead{text-align:center;font-size:13.5px;color:var(--sub);line-height:1.75;margin:10px 0 2px}
  .citybtn{width:100%;font:inherit;font-size:20px;font-weight:900;text-align:left;padding:8px 6px;border:0;border-bottom:2px dashed #E9B9B4;background:transparent;color:#CFC3BD;cursor:pointer;display:flex;align-items:center}
  .citybtn::after{content:'▾';margin-left:auto;color:var(--red);font-size:16px}
  .citybtn.on{color:var(--ink)}
  .csheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center}
  .csheet{width:100%;max-width:520px;max-height:82vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:cup .2s ease-out}
  @keyframes cup{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .csheet h4{margin:0 2px 8px;font-size:18px;font-weight:900;display:flex;align-items:center}.csheet h4 small{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
  .cg{font-size:12px;font-weight:800;color:#EE6A62;margin:10px 2px 6px;letter-spacing:1px}
  .cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .cgrid button{font:inherit;font-size:15.5px;font-weight:800;padding:11px 0;border:2px solid #EED6D2;border-radius:10px;background:var(--cream);color:var(--ink);cursor:pointer}
  .cgrid button.on{background:linear-gradient(#E83228,#C8161D);border-color:#9E1015;color:#fff}
  .mapbtn{display:block;text-align:center;text-decoration:none;margin-top:10px}
  .box{border:2px solid var(--red);border-radius:12px;background:#fff;padding:11px 12px 12px;margin-top:12px}
  .bh{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  .bh b{font-size:16px;font-weight:900}.bh em{font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:1.5px;color:#EE6A62}
  .bh small{margin-left:auto;font-size:11.5px;color:var(--sub)}
  input.txt{width:100%;font:inherit;font-size:24px;font-weight:900;padding:6px 4px;border:0;border-bottom:2px dashed #E9B9B4;background:transparent;outline:none;color:var(--ink)}
  input.txt::placeholder{color:#CFC3BD;font-weight:700}
  input.txt:focus{border-bottom-color:var(--red)}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .role{font:inherit;text-align:left;border:2px solid #EED6D2;background:var(--cream);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--ink)}
  .role .e{width:46px;height:50px;flex:none;display:flex;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
  .role .e img,.role .e svg{width:100%;height:100%;object-fit:contain}
  .role b{display:block;font-size:15.5px;font-weight:900;white-space:nowrap}.role span{display:block;font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap}
  .role .ck{display:none}
  .role.wide{grid-column:1/-1}
  .role.wide b{font-size:17px}
  .role.wide .e{width:54px;height:58px}
  .role.wide .ck{display:flex;margin-left:auto;width:24px;height:24px;border-radius:5px;border:2px solid #E9B9B4;align-items:center;justify-content:center;font-size:14px;color:#fff;flex:none}
  .role.on{background:linear-gradient(#E83228,#C8161D);border-color:#9E1015;color:#fff;box-shadow:0 4px 0 #8E0E12}
  .role.on b,.role.on span{color:#fff}
  .role.on .e{color:var(--red)}
  .role.on .ck{background:#fff;border-color:#fff;color:var(--red)}
  .skills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .skill{font:inherit;font-size:15.5px;font-weight:900;border:2px solid #CFCAC6;background:#E9E6E3;color:#9A9592;border-radius:6px;padding:11px 6px;cursor:pointer;text-align:center}
  .skill .c{display:none}
  .skill.on{background:linear-gradient(#E0342F,#C21B22);border-color:#A3171C;color:#fff;box-shadow:0 3px 0 #8E0E12}
  .skill.on::before{content:"✓ "}
  .pledge{text-align:center;font-size:12.5px;color:#4a3f3b;line-height:1.7;margin-top:12px}
  .ecg{display:block;width:100%;height:26px;margin-top:4px}
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(251,245,236,0),var(--paper) 40%)}
  .cta .btn{max-width:448px;margin:0 auto}
  .btn{display:block;width:100%;font:inherit;font-size:17px;font-weight:900;border:0;border-radius:12px;padding:15px;cursor:pointer;text-align:center;margin-top:10px;text-decoration:none;letter-spacing:1px}
  .btn.main{background:linear-gradient(#E83228,#C8161D);color:#fff;box-shadow:0 5px 0 #8E0E12,0 10px 20px rgba(200,22,29,.25)}
  .btn.line{background:#06C755;color:#fff;box-shadow:0 5px 0 #048a3b}
  .btn.ghost{background:var(--cream);color:var(--ink);border:2px solid var(--red)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2 .btn{margin-top:0}
  .cardv{padding:14px 14px 0}
  canvas{width:100%;display:block;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);touch-action:none;background:#FBF4EA}
  .zoom{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);margin:14px 4px 4px}
  .zoom input{flex:1;accent-color:var(--red)}
  .copy{text-align:center;font-size:12px;letter-spacing:2px;color:#A39690;margin:26px 0 8px}
  .note{font-size:12px;color:var(--sub);text-align:center;line-height:1.8;margin-top:16px}
  .spin{width:34px;height:34px;border:4px solid #f0d9d4;border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:120px auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
  #toast.show{opacity:1}
  .ov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
  .ov img{max-width:100%;max-height:72vh;border-radius:8px}
  .ov .t{color:#fff;font-weight:800;font-size:15px;text-align:center}
  .ov .row2{width:100%;max-width:360px}
  .ov .btn{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div id="v-loading"><div class="spin"></div><p style="text-align:center;font-size:13px;color:#6E625C">讀取中…</p></div>

  <!-- 第 1 步：填資料 -->
  <div id="v-form" class="hidden">
    <div class="hero"><img src="../richmenu/guardian-promo.jpg?v=3" alt="全民醫護證"></div>
    <div class="sheet"><div class="frame">
      <div class="ttl"><b>我是守護員</b></div>
      <div class="en">I AM A GUARDIAN</div>
      <div class="lead">不用證照，只要一顆願意幫忙的心。<br>填好下面資料，領取你的全民醫護證。</div>
      <div class="box"><div class="bh"><b>姓名</b><em>NAME</em><small>會印在證件上</small></div>
        <input class="txt" id="f-name" maxlength="8" placeholder="請輸入你的名字" autocomplete="off"></div>
      <div class="box"><div class="bh"><b>所在縣市</b><em>CITY</em><small>統計全台守護員分布</small></div>
        <button type="button" class="citybtn" id="f-city">請選擇縣市</button></div>
      <div class="box"><div class="bh"><b>身分</b><em>POSITION</em><small>沒有證照選第一個</small></div>
        <div class="roles" id="f-pos"></div></div>
      <div class="box"><div class="bh"><b>我會的守護技能</b><em>SKILLS</em><small>可複選</small></div>
        <div class="skills" id="f-skills"></div></div>
      <div class="pledge">我願意在需要的時候伸出手——看見有人不舒服，<br>我會停下來、陪伴他、幫他求救。</div>
      <svg class="ecg" viewBox="0 0 300 26" preserveAspectRatio="none"><polyline points="0,13 95,13 103,4 110,22 117,2 124,13 175,13 183,4 190,22 197,2 204,13 300,13" fill="none" stroke="#E2231A" stroke-width="2"/></svg>
    </div></div>
    <div class="cta"><button class="btn main" id="f-next">產生我的醫護證 →</button></div>
  </div>

  <!-- 第 2 步：醫護證 -->
  <div id="v-card" class="hidden cardv">
    <canvas id="cv" width="1080" height="1620"></canvas>
    <div class="zoom" id="zoomrow">🔍<input type="range" id="zoom" min="1" max="3" step="0.01" value="1">拖曳照片可移動</div>
    <div class="row2" style="margin-top:12px">
      <label class="btn ghost" style="margin:0">📷 換照片<input type="file" id="file" accept="image/*" style="display:none"></label>
      <button class="btn ghost" id="edit">✏️ 修改資料</button>
    </div>
    <button class="btn main" id="save">⬇ 存成圖片</button>
    <button class="btn line" id="invite">➦ 邀請親友一起領</button>
    <a class="btn ghost mapbtn" href="map.html">🗺️ 看看全台守護員分布</a>
    <div class="note" id="lockNote" style="display:none">✅ 資料已儲存，下次打開會直接顯示這張醫護證；要改請按「修改資料」</div>
    <div class="note">🔒 照片只在你的手機上合成，不會上傳</div>
    <div class="copy">© 2026 白沙屯慈昕醫護文化協會 版權所有</div>
  </div>
</div>
<div id="toast"></div>

<script>

    'EMTP': '<svg  xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" > <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /> <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" /> </svg>',
    '護理師': '<svg  xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" > <rect width="8" height="4" x="8" y="2" rx="1" ry="1" /> <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /> <path d="M9 14h6" /> <path d="M12 17v-6" /> </svg>',
    '醫師': '<svg  xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" > <path d="M11 2v2" /> <path d="M5 2v2" /> <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" /> <path d="M8 15a6 6 0 0 0 12 0v-3" /> <circle cx="20" cy="10" r="2" /> </svg>',

  const roleOf = k => ROLES.find(r => r.k === k) || ROLES[0];
  const FONT = '"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif';
  const W = 1024, H = 1536;                       // 模板原始尺寸
  const PH = { x: 511, y: 582, r: 159 };          // 大頭照圓框

  const remember = () => { try { localStorage.setItem(KEY, JSON.stringify({ name: st.name, pos: st.pos, skills: st.skills, city: st.city, locked: !!st.locked })); } catch (e) {} };
  const CITY_GROUPS = [['北部', ['基隆市', '台北市', '新北市', '桃園市', '新竹市', '新竹縣']], ['中部', ['苗栗縣', '台中市', '彰化縣', '南投縣', '雲林縣']],

  function pickCity() {

    bg.innerHTML = `<div class="csheet"><h4>你住在哪個縣市？<small>點一下選擇</small></h4>${CITY_GROUPS.map(([g, cs]) => `<div class="cg">${g}</div><div class="cgrid">${cs.map(c => `<button type="button" data-c="${c}" class="${st.city === c ? 'on' : ''}">${c}</button>`).join('')}</div>`).join('')}</div>`;

  const applyLocked = j => { if (!j || !j.locked) return false; st.locked = true; st.name = j.name || st.name; st.pos = j.pos || st.pos; st.city = j.city || st.city;
    if (Array.isArray(j.skills) && j.skills.length) st.skills = j.skills.map(Boolean); if (j.no) st.no = j.no; remember(); lockUI(); return true; };
  function lockUI() { const n = $('lockNote'); if (n) n.style.display = st.locked ? 'block' : 'none'; }
  async function submitLock() {
    if (!hasLiff()) { st.locked = true; remember(); lockUI(); return true; }
    const at = liff.getAccessToken(); if (!at) return false;
    const r = await fetch(AUTH_URL + '/guardian-no', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accessToken: at, city: st.city, pos: st.pos, name: st.name, skills: st.skills }) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || '送出失敗');
    if (j.no) st.no = j.no; applyLocked(j); return true;
  }  function toast(m, ms) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms || 2200); }
  function view(id) { ['v-loading', 'v-form', 'v-card'].forEach(v => $(v).classList.toggle('hidden', v !== id)); window.scrollTo(0, 0); }
  const load = (src, cors) => new Promise((res, rej) => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const today = () => { const d = new Date(); return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`; };
  const hasLiff = () => !!(LIFF_ID && window.liff);

  // ---------- 表單 ----------
  function drawForm() {
    $('f-name').value = st.name || '';
    { const cb = $('f-city'); cb.textContent = st.city || '請選擇縣市'; cb.classList.toggle('on', !!st.city); cb.onclick = pickCity; }
    $('f-pos').innerHTML = ROLES.map((r, i) => `<button type="button" data-p="${r.k}" class="role${i ? '' : ' wide'}${st.pos === r.k ? ' on' : ''}"><span class="e">${BADGE[r.k] ? `<img src="roles/${BADGE[r.k]}.png?v=1" alt="">` : (ICON[r.k] || r.e)}</span><span><b>${r.k}</b><span>${r.d}</span></span><span class="ck">${st.pos === r.k ? '✓' : ''}</span></button>`).join('');
    const R = roleOf(st.pos);
    $('f-skills').innerHTML = R.sk.map((s, i) => `<button type="button" data-s="${i}" class="skill${st.skills[i] ? ' on' : ''}"><span class="c">${st.skills[i] ? '✓' : ''}</span>${s}</button>`).join('');
    document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (st.pos === b.dataset.p) return; st.pos = b.dataset.p; st.skills = roleOf(st.pos).def.map(Boolean); st.name = $('f-name').value.trim(); drawForm(); });
    document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { st.skills[+b.dataset.s] = !st.skills[+b.dataset.s]; st.name = $('f-name').value.trim(); drawForm(); });
  }
  $('f-next').onclick = async () => {
    st.name = $('f-name').value.trim();
    if (!st.name) { $('f-name').focus(); return toast('請先填寫姓名'); }
    if (!st.city) { pickCity(); return toast('請選擇所在縣市'); }
    const btn = $('f-next'); btn.disabled = true; btn.textContent = '送出中…';
    try { await submitLock(); remember(); view('v-card'); draw(); toast('✅ 已儲存'); }
    catch (e) { toast('送出失敗，請再試一次：' + (e.message || e), 3500); }
    finally { btn.disabled = false; btn.textContent = '產生我的醫護證 →'; }
  };
  $('edit').onclick = () => { drawForm(); view('v-form'); };

  // ---------- 畫醫護證 ----------
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function fit(c, text, weight, size, maxW, min) { let f = size; c.font = `${weight} ${f}px ${FONT}`; while (c.measureText(text).width > maxW && f > min) { f -= 1; c.font = `${weight} ${f}px ${FONT}`; } return f; }
  function draw() {
    const cv = $('cv'), c = cv.getContext('2d'), k = cv.width / W;
    c.setTransform(k, 0, 0, k, 0, 0); c.fillStyle = '#FBF4EA'; c.fillRect(0, 0, W, H);
    if (st.tpl) c.drawImage(st.tpl, 0, 0, W, H);
    // 大頭照
    c.save(); c.beginPath(); c.arc(PH.x, PH.y, PH.r, 0, Math.PI * 2); c.clip();
    if (st.photo) { const p = st.photo, s = Math.max(2 * PH.r / p.naturalWidth, 2 * PH.r / p.naturalHeight) * st.zoom, w = p.naturalWidth * s, h = p.naturalHeight * s;
      c.drawImage(p, PH.x - w / 2 + st.ox, PH.y - h / 2 + st.oy, w, h); }
    else { c.fillStyle = '#E3DCD8'; c.fillRect(PH.x - PH.r, PH.y - PH.r, PH.r * 2, PH.r * 2); c.fillStyle = '#C9BDB8';
      c.beginPath(); c.arc(PH.x, PH.y - 40, 60, 0, Math.PI * 2); c.fill(); c.beginPath(); c.ellipse(PH.x, PH.y + 140, 120, 105, 0, 0, Math.PI * 2); c.fill(); }
    c.restore();
    if (st.badge) c.drawImage(st.badge, 657 - 54, 694 - 54, 108, 108);
    c.textBaseline = 'middle';
    // 姓名
    c.textAlign = 'left'; c.fillStyle = '#111'; fit(c, st.name || '你的名字', 900, 64, 450, 30); c.fillText(st.name || '你的名字', 134, 912);
    // 身分
    fit(c, st.pos, 900, 34, 168, 20); const tw = c.measureText(st.pos).width, pw = tw + 30;
    rr(c, 802 - pw / 2, 885, pw, 54, 10); c.fillStyle = '#FFF'; c.fill(); c.lineWidth = 3.5; c.strokeStyle = '#D7262B'; c.stroke();
    c.fillStyle = '#C81E25'; c.textAlign = 'center'; c.fillText(st.pos, 802, 913);
    // 技能
    roleOf(st.pos).sk.forEach((t, i) => { const x = i % 2 ? 519 : 137, y = i < 2 ? 998 : 1054, on = st.skills[i];
      rr(c, x, y, 370, 50, 6);
      if (on) { const g = c.createLinearGradient(0, y, 0, y + 50); g.addColorStop(0, '#DA2A2E'); g.addColorStop(1, '#C21B22'); c.fillStyle = g; } else c.fillStyle = '#E6E4E2';
      c.fill(); c.lineWidth = 2; c.strokeStyle = on ? '#A3171C' : '#C9C5C2'; c.stroke();
      c.fillStyle = on ? '#fff' : '#9A9592'; fit(c, (on ? '✓ ' : '') + t, 800, 30, 340, 20); c.textAlign = 'center'; c.fillText((on ? '✓ ' : '') + t, x + 185, y + 26); });
    // 日期（左側直排）
    c.save(); c.translate(70, 585); c.rotate(Math.PI / 2);
    c.font = `900 30px ${FONT}`; const dw = c.measureText(st.date).width + 40;
    rr(c, -dw / 2, -26, dw, 52, 26); c.fillStyle = '#C81E25'; c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(st.date, 0, 1); c.restore();
    // 守護編號（右側直排）
    c.save(); c.translate(958, 470); c.rotate(Math.PI / 2);
    const no = st.no ? 'NO.' + String(st.no).padStart(6, '0') : 'NO.------';
    c.font = `700 20px ${FONT}`; c.fillStyle = '#8A7C76'; c.textAlign = 'center'; c.fillText('GUARDIAN', 0, -24);
    c.font = `900 34px ${FONT}`; c.fillStyle = '#C81E25'; c.fillText(no, 0, 10); c.restore();
  }

  // 換照片、拖曳、縮放
  $('zoom').oninput = e => { st.zoom = +e.target.value; draw(); };
  $('file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { st.photo = await load(URL.createObjectURL(f)); st.zoom = 1; st.ox = st.oy = 0; $('zoom').value = 1; draw(); } catch (err) { toast('讀不到這張照片'); } };
  (function () {
    const cv = $('cv'), pts = new Map(); let last = null, pinch = null;
    const pos = ev => { const r = cv.getBoundingClientRect(), f = W / r.width; return [(ev.clientX - r.left) * f, (ev.clientY - r.top) * f]; };
    const inPhoto = p => Math.hypot(p[0] - PH.x, p[1] - PH.y) < PH.r + 40;
    cv.addEventListener('pointerdown', ev => { const p = pos(ev); if (!st.photo || (!pts.size && !inPhoto(p))) return; cv.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, p); last = p; pinch = null; });
    cv.addEventListener('pointermove', ev => { if (!pts.has(ev.pointerId)) return; ev.preventDefault(); pts.set(ev.pointerId, pos(ev));
      if (pts.size >= 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (pinch) { st.zoom = Math.min(3, Math.max(1, pinch.z * d / pinch.d)); $('zoom').value = st.zoom; } else pinch = { d, z: st.zoom }; }
      else { const p = pos(ev); if (last) { st.ox += p[0] - last[0]; st.oy += p[1] - last[1]; } last = p; }
      draw(); });
    const up = ev => { pts.delete(ev.pointerId); last = null; if (pts.size < 2) pinch = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  })();

  // 存圖
  $('save').onclick = () => {
    draw(); let url; try { url = $('cv').toDataURL('image/jpeg', 0.92); } catch (e) { return toast('產生圖片失敗，請換一張照片再試'); }
    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = `<div class="t">📱 長按圖片 →「儲存圖片」或直接分享</div><img src="${url}" alt="全民醫護證">
      <div class="row2"><a class="btn" style="background:#fff;color:#111" download="全民醫護證.jpg" href="${url}">⬇ 下載</a><button class="btn ghost" id="ovx">關閉</button></div>`;
    document.body.appendChild(ov); ov.querySelector('#ovx').onclick = () => ov.remove(); ov.onclick = e => { if (e.target === ov) ov.remove(); };
  };
  // 邀請親友（傳的是邀請卡，不含個人照片）
  $('invite').onclick = async () => {
    if (!hasLiff() || !liff.isApiAvailable('shareTargetPicker')) return toast('請在 LINE 裡打開這個頁面才能分享');
    try { const r = await fetch(AUTH_URL + '/share-get?id=guardian'), j = await r.json(); if (!j.ok) throw new Error(j.error || '讀不到卡片');
      const res = await liff.shareTargetPicker([j.card.flex], { isMultiple: true }); if (res) toast('✅ 已分享'); }
    catch (e) { toast('分享失敗：' + (e.message || e), 3500); }
  };

  // ---------- 啟動 ----------
  async function start() {
    st.date = today();
    const assets = Promise.all([load('gc-tpl.jpg?v=2'), load('gc-badge.png?v=2')]).then(([a, b]) => { st.tpl = a; st.badge = b; }).catch(() => toast('圖片載入失敗，請重新整理'));
    if (hasLiff()) {
      try { await Promise.race([liff.init({ liffId: LIFF_ID }), new Promise((_, r) => setTimeout(() => r(new Error('逾時')), 9000))]); } catch (e) {}
      try {
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
        const pf = await liff.getProfile(); st.profile = pf;
        if (!st.name) st.name = String(pf.displayName || '').slice(0, 8);
        if (pf.pictureUrl) load(AUTH_URL + '/pic?u=' + encodeURIComponent(pf.pictureUrl), true).then(i => { if (!st.photo) { st.photo = i; draw(); } }).catch(() => {});
        const at = liff.getAccessToken();
        if (at) { try { const r = await Promise.race([fetch(AUTH_URL + '/guardian-no', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accessToken: at }) }), new Promise((_, rj) => setTimeout(() => rj(new Error('逾時')), 8000))]);
          const j = await r.json(); if (j.ok) { st.no = j.no; if (!j.locked) st.locked = false; applyLocked(j); } } catch (e) {} }
      } catch (e) {}
    }
    await assets; lockUI();
    if (st.locked) { view('v-card'); draw(); } else { drawForm(); view('v-form'); }
  }
  start();
})();
</script>
</body>
</html>
