<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>白沙屯醫護團 - 會員中心</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --primary: #D65A68; --accent: #F08339; --gold: #B68D40;
    --ink: #1f2430; --sub: #6b7280; --line: rgba(0,0,0,0.06);
    --card: rgba(255,255,255,0.78); --card-border: rgba(255,255,255,0.9);
    --shadow: 0 10px 30px rgba(31,38,135,0.07);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #f6f3f2; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body::before { content: ''; position: fixed; top: -20%; left: -20%; width: 80%; height: 70%; z-index: -1;
    background: radial-gradient(circle, rgba(214,90,104,0.14) 0%, rgba(255,255,255,0) 70%); }
  body::after { content: ''; position: fixed; bottom: -20%; right: -20%; width: 80%; height: 70%; z-index: -1;
    background: radial-gradient(circle, rgba(240,131,57,0.12) 0%, rgba(255,255,255,0) 70%); }
  .wrap { max-width: 480px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }

  .top { display: flex; justify-content: space-between; align-items: flex-end; margin: 4px 4px 18px; }
  .org { font-size: 11px; font-weight: 700; color: #9a9a9a; letter-spacing: 2px; }
  .title { font-size: 28px; font-weight: 900; margin-top: 2px;
    background: linear-gradient(90deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 22px; box-shadow: var(--shadow);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

  /* 會員卡 */
  .member { position: relative; overflow: hidden; padding: 22px 20px 20px; color: #fff; border: none;
    background: linear-gradient(135deg, #D65A68 0%, #E97452 55%, #F08339 100%); box-shadow: 0 16px 34px rgba(214,90,104,0.32); }
  .member::after { content: ''; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%;
    background: rgba(255,255,255,0.10); }
  .member-head { display: flex; gap: 14px; align-items: center; position: relative; z-index: 1; }
  .avatar { width: 68px; height: 68px; border-radius: 50%; flex-shrink: 0; border: 3px solid rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.25) center/cover no-repeat; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; }
  .m-name { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
  .m-line { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.35); }
  .badge.solid { background: #fff; color: var(--primary); border-color: #fff; }
  .member-foot { display: flex; justify-content: space-between; margin-top: 18px; font-size: 11px; opacity: 0.85; position: relative; z-index: 1; }

  .sec { font-size: 13px; font-weight: 800; color: var(--gold); margin: 22px 6px 8px; letter-spacing: 1px; }
  .rows .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
  .rows .row:last-child { border-bottom: none; }
  .k { font-size: 14px; font-weight: 700; color: var(--ink); flex-shrink: 0; white-space: nowrap; }
  .v { font-size: 14px; color: var(--sub); text-align: right; word-break: break-all; }
  .v b { color: var(--ink); }
  .eye { border: none; background: rgba(214,90,104,0.10); color: var(--primary); font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 8px; margin-left: 6px; cursor: pointer; }
  .ok { color: #16a34a; font-weight: 800; }
  .warn { color: #dc2626; font-weight: 800; }

  .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .app { display: flex; flex-direction: column; gap: 4px; padding: 16px; text-decoration: none; color: var(--ink); cursor: pointer; border: none; text-align: left; font: inherit; }
  .app .ic { font-size: 24px; }
  .app .t { font-size: 15px; font-weight: 800; }
  .app .d { font-size: 11px; color: var(--sub); }
  .app:active { transform: scale(0.97); }

  .note { font-size: 11px; color: #9ca3af; text-align: center; margin: 22px 10px 0; line-height: 1.7; }

  /* 登入 / 註冊 / 狀態 */
  .auth { padding: 28px 22px; text-align: center; }
  .auth h2 { margin: 6px 0 8px; font-size: 21px; color: var(--primary); }
  .auth p { margin: 0 0 16px; font-size: 14px; color: var(--sub); line-height: 1.7; white-space: pre-line; }
  .auth .avatar { margin: 0 auto 10px; border-color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.08); color: var(--primary); background-color: #fde8ea; }
  .field { text-align: left; margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 800; color: #555; margin: 0 0 6px 2px; }
  .field input { width: 100%; padding: 13px 14px; font-size: 16px; border-radius: 12px; border: 1.5px solid #e5e7eb; background: #fff; outline: none; }
  .field input:focus { border-color: var(--primary); }
  .certs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cert { border: 1.5px solid #e5e7eb; background: #fff; color: #334155; font-size: 14px; font-weight: 800; padding: 11px 4px; border-radius: 12px; cursor: pointer; }
  .cert.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn { width: 100%; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(90deg, var(--primary), #E97A85); box-shadow: 0 8px 20px rgba(214,90,104,0.28); margin-top: 6px; }
  .btn.line { background: #06c755; box-shadow: 0 8px 20px rgba(6,199,85,0.28); }
  .btn.ghost { background: #eef0f3; color: #444; box-shadow: none; }
  .btn:disabled { opacity: 0.6; }
  .reason { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 12px; padding: 10px 12px; font-size: 13px; text-align: left; margin-bottom: 14px; white-space: pre-line; }
  .spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid #f3d3d7; border-top-color: var(--primary); margin: 10px auto 16px; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  .toast { position: fixed; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(30,30,30,0.92); color: #fff;
    padding: 11px 18px; border-radius: 14px; font-size: 14px; font-weight: 700; z-index: 99; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: pre-line; text-align: center; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="org">白沙屯醫護團</div>
      <div class="title">會員中心</div>
    </div>
  </div>

  <!-- 讀取中 -->
  <div id="v-loading" class="card auth">
    <div class="spin"></div>
    <p id="loading-text">正在識別 LINE 身分…</p>
  </div>

  <!-- 需要 LINE 登入 / 錯誤 -->
  <div id="v-login" class="card auth hidden">
    <h2>會員登入</h2>
    <p id="login-msg">請使用 LINE 登入，與「救護紀錄表」「倉庫管理」使用同一個會員身分。</p>
    <button class="btn line" id="btn-line-login">使用 LINE 登入</button>
    <button class="btn ghost hidden" id="btn-retry" onclick="location.reload()">重新整理</button>
  </div>

  <!-- 註冊（與兩個系統共用同一份資料） -->
  <div id="v-register" class="card auth hidden">
    <div class="avatar reg-avatar"></div>
    <h2 id="reg-title">實名制綁定</h2>
    <p>與「救護紀錄表」「倉庫管理」共用同一份會員資料<br>只需填寫一次，送出後等待管理員審核</p>
    <div class="reason hidden" id="reg-reason"></div>
    <div class="field"><label>真實姓名</label><input id="reg-name" placeholder="請輸入本名" autocomplete="name"></div>
    <div class="field"><label>身分證字號</label><input id="reg-id" placeholder="請輸入身分證字號" maxlength="10" style="text-transform:uppercase" autocomplete="off"></div>
    <div class="field"><label>證照類別</label><div class="certs" id="reg-certs"></div></div>
    <button class="btn" id="btn-submit">送出審核</button>
  </div>

  <!-- 狀態：等待審核 / 退回 / 停權 -->
  <div id="v-status" class="card auth hidden">
    <div class="avatar st-avatar"></div>
    <h2 id="st-title"></h2>
    <p id="st-msg"></p>
    <div class="reason hidden" id="st-reason"></div>
    <button class="btn hidden" id="btn-resubmit">重新填寫並送審</button>
  </div>

  <!-- 會員資料 -->
  <div id="v-member" class="hidden">
    <div class="card member">
      <div class="member-head">
        <div class="avatar" id="m-avatar"></div>
        <div style="min-width:0">
          <div class="m-name" id="m-name"></div>
          <div class="m-line" id="m-line"></div>
          <div class="badges" id="m-badges"></div>
        </div>
      </div>
      <div class="member-foot">
        <span id="m-since"></span>
        <span>白沙屯醫護團 會員</span>
      </div>
    </div>

    <div class="sec">基本資料</div>
    <div class="card rows">
      <div class="row"><span class="k">真實姓名</span><span class="v" id="f-name"></span></div>
      <div class="row"><span class="k">身分證字號</span><span class="v"><span id="f-id"></span><button class="eye" id="btn-eye">顯示</button></span></div>
      <div class="row"><span class="k">證照類別</span><span class="v" id="f-cert"></span></div>
      <div class="row"><span class="k">分類</span><span class="v" id="f-cat"></span></div>
      <div class="row"><span class="k">身分</span><span class="v" id="f-role"></span></div>
      <div class="row"><span class="k">審核狀態</span><span class="v" id="f-status"></span></div>
      <div class="row"><span class="k">LINE 名稱</span><span class="v" id="f-line"></span></div>
    </div>

    <div class="sec">使用紀錄</div>
    <div class="card rows">
      <div class="row"><span class="k">加入時間</span><span class="v" id="f-created"></span></div>
      <div class="row"><span class="k">救護紀錄表 上次登入</span><span class="v" id="f-bst"></span></div>
      <div class="row"><span class="k">倉庫管理 上次登入</span><span class="v" id="f-wh"></span></div>
      <div class="row"><span class="k">倉庫使用權限</span><span class="v" id="f-whstate"></span></div>
    </div>

    <div class="sec">前往系統</div>
    <div class="apps">
      <button class="card app" data-open="https://liff.line.me/2011820105-6oXAxIEi">
        <span class="ic">🚑</span><span class="t">救護紀錄表</span><span class="d">填寫與查看救護紀錄</span>
      </button>
      <button class="card app" data-open="https://liff.line.me/2011820105-ofRs4ehy">
        <span class="ic">📦</span><span class="t">倉庫管理</span><span class="d">我的 QR、持有物品</span>
      </button>
    </div>

    <div class="note">資料與「救護紀錄表」「倉庫管理」同步。<br>如需修改姓名、身分證或證照類別，請聯絡管理員。</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, onSnapshot, query, limit, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 與「救護紀錄表」「倉庫管理」共用同一個 Firebase 專案
  const app = initializeApp({
    apiKey: "AIzaSyA_5hmnIBCeLszWW8kIjgOZelv-c6-ALfY",
    authDomain: "linebot-firebase-b1242.firebaseapp.com",
    projectId: "linebot-firebase-b1242",
    storageBucket: "linebot-firebase-b1242.firebasestorage.app",
    messagingSenderId: "1002268658683",
    appId: "1:1002268658683:web:739adcd7819f8c9393595e"
  });
  const db = getFirestore(app);

  // 同一個 LINE Login 頻道的 LIFF，會員的 LINE userId 與其他兩個系統相同
  const LIFF_ID = '2011820105-x1KU6xLW';   // 會員中心專用 LIFF（Endpoint: /STOREHOUSE/member/）
  const CERTS = ['EMT-1', 'EMT-2', 'EMT-P', '護理師', '醫師', '無證照'];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const tsMs = t => (t && typeof t.toMillis === 'function') ? t.toMillis() : (Number(t) || 0);
  const inLine = () => { try { return !!(window.liff && liff.isInClient()); } catch (e) { return false; } };

  let profile = null, user = null, unsub = null, regCert = '', isResubmit = false, showId = false;

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function show(view) {
    ['v-loading', 'v-login', 'v-register', 'v-status', 'v-member'].forEach(id => $(id).classList.toggle('hidden', id !== view));
  }
  function setAvatar(el, url, name) {
    el.style.backgroundImage = url ? `url("${url}")` : '';
    el.textContent = url ? '' : (String(name || '?').trim().charAt(0) || '?');
  }
  function fmt(ms) {
    if (!ms) return '尚無紀錄';
    const d = new Date(ms), p = n => String(n).padStart(2, '0');
    const m = Math.floor((Date.now() - ms) / 60000);
    const rel = m < 1 ? '剛剛' : m < 60 ? `${m} 分鐘前` : m < 1440 ? `${Math.floor(m / 60)} 小時前` : `${Math.floor(m / 1440)} 天前`;
    const y = d.getFullYear() === new Date().getFullYear() ? '' : d.getFullYear() + '/';
    return `${y}${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}（${rel}）`;
  }
  const maskId = id => id && id.length >= 10 ? id.slice(0, 3) + '****' + id.slice(-3) : (id || '—');

  // ---------- 證照選擇 ----------
  CERTS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cert'; b.textContent = c; b.dataset.cert = c;
    b.onclick = () => pickCert(c);
    $('reg-certs').appendChild(b);
  });
  function pickCert(c) {
    regCert = CERTS.includes(c) ? c : '';
    document.querySelectorAll('#reg-certs .cert').forEach(x => x.classList.toggle('on', x.dataset.cert === regCert));
  }

  // ---------- 畫面 ----------
  function render() {
    if (!user) {
      setAvatar(document.querySelector('.reg-avatar'), profile.pictureUrl, profile.displayName);
      $('reg-title').textContent = '實名制綁定';
      $('reg-reason').classList.add('hidden');
      show('v-register');
      return;
    }
    const st = user.status || 'pending';
    if (st !== 'approved') {
      if (isResubmit && st === 'rejected') return;   // 正在重新填寫，不打斷
      setAvatar(document.querySelector('.st-avatar'), user.pictureUrl || profile.pictureUrl, user.realName);
      const reason = (user.rejectReason || '').trim();
      $('btn-resubmit').classList.toggle('hidden', st !== 'rejected');
      $('st-reason').classList.toggle('hidden', !reason || st === 'pending');
      $('st-reason').textContent = (st === 'banned' ? '停權原因：' : '退回原因：') + reason;
      if (st === 'rejected') { $('st-title').textContent = '❌ 審核未通過'; $('st-msg').textContent = '請依原因修正資料後重新送審。'; }
      else if (st === 'banned') { $('st-title').textContent = '🚫 帳號已停權'; $('st-msg').textContent = '目前無法使用，如有疑問請聯絡管理員。'; }
      else { $('st-title').textContent = '⏳ 等待審核中'; $('st-msg').textContent = '你的資料已送出，管理員核准後\n這個畫面會自動更新。'; }
      show('v-status');
      return;
    }

    const name = user.realName || '';
    const cert = user.certification || '';
    const cat = ('category' in user) ? (user.category || '') : (user.warehouseCategory || '');
    const isAdmin = user.role === 'admin';
    setAvatar($('m-avatar'), user.pictureUrl || profile.pictureUrl, name);
    $('m-name').textContent = name || '(未命名)';
    $('m-line').textContent = 'LINE：' + (user.lineDisplayName || profile.displayName || '—');
    $('m-badges').innerHTML = (cert ? `<span class="badge solid">${esc(cert)}</span>` : '')
      + (cat && cat !== cert ? `<span class="badge">🏷️ ${esc(cat)}</span>` : '')
      + (isAdmin ? '<span class="badge">⭐ 管理員</span>' : '');
    const created = tsMs(user.createdAt);
    $('m-since').textContent = created ? '加入於 ' + new Date(created).toLocaleDateString('zh-TW') : '';

    $('f-name').innerHTML = `<b>${esc(name || '—')}</b>`;
    $('f-id').textContent = showId ? (user.idCard || '—') : maskId(user.idCard);
    $('btn-eye').textContent = showId ? '隱藏' : '顯示';
    $('f-cert').textContent = cert || '未填寫';
    $('f-cat').textContent = cat || '未分類';
    $('f-role').innerHTML = isAdmin ? '<b>管理員</b>' : '一般會員';
    $('f-status').innerHTML = '<span class="ok">✅ 已核准</span>';
    $('f-line').textContent = user.lineDisplayName || profile.displayName || '—';
    $('f-created').textContent = created ? fmt(created) : '—';
    $('f-bst').textContent = fmt(tsMs(user.bstLastLoginAt));
    $('f-wh').textContent = fmt(tsMs(user.warehouseLastLoginAt));
    $('f-whstate').innerHTML = user.warehouseRemoved ? '<span class="warn">⛔ 已移出倉庫</span>' : '<span class="ok">可使用</span>';
    show('v-member');
  }

  $('btn-eye').onclick = () => { showId = !showId; render(); };
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    const url = b.dataset.open;
    try { if (inLine()) { liff.openWindow({ url, external: false }); return; } } catch (e) {}
    location.href = url;
  });
  $('btn-resubmit').onclick = () => {
    isResubmit = true;
    $('reg-name').value = user.realName || '';
    $('reg-id').value = user.idCard || '';
    pickCert(user.certification || user.category || '');
    setAvatar(document.querySelector('.reg-avatar'), profile.pictureUrl, user.realName);
    $('reg-title').textContent = '重新送審';
    const r = (user.rejectReason || '').trim();
    $('reg-reason').classList.toggle('hidden', !r);
    $('reg-reason').textContent = '退回原因：' + r;
    show('v-register');
  };

  // ---------- 送出註冊（欄位與另外兩個系統完全相同）----------
  $('btn-submit').onclick = async () => {
    const realName = $('reg-name').value.trim();
    const idCard = $('reg-id').value.trim().toUpperCase();
    if (!realName) return toast('請輸入真實姓名');
    if (!/^[A-Z][1289]\d{8}$/.test(idCard)) return toast('身分證字號格式不正確');
    if (!regCert) return toast('請選擇證照類別');
    const btn = $('btn-submit'); btn.disabled = true; btn.textContent = '送出中…';
    const ref = doc(db, 'users', profile.userId);
    try {
      const base = { lineDisplayName: profile.displayName || '', pictureUrl: profile.pictureUrl || '', realName, idCard,
        certification: regCert, category: regCert, warehouseCategory: regCert };
      if (isResubmit) {
        await updateDoc(ref, { ...base, status: 'pending', rejectReason: '', resubmittedAt: serverTimestamp() });
      } else {
        const first = (await getDocs(query(collection(db, 'users'), limit(1)))).empty;   // 第一位使用者 = 管理員
        await setDoc(ref, { ...base, lineUserId: profile.userId, status: first ? 'approved' : 'pending', role: first ? 'admin' : 'user', createdAt: serverTimestamp() });
      }
      isResubmit = false;
      toast('✅ 已送出');
    } catch (e) {
      toast('❌ 送出失敗，請重試');
    } finally {
      btn.disabled = false; btn.textContent = '送出審核';
    }
  };

  // ---------- 啟動 ----------
  async function start() {
    if (!window.liff) { $('login-msg').textContent = 'LINE 元件載入失敗，請檢查網路後重新整理。'; $('btn-line-login').classList.add('hidden'); $('btn-retry').classList.remove('hidden'); return show('v-login'); }
    try {
      await Promise.race([liff.init({ liffId: LIFF_ID }), new Promise((_, r) => setTimeout(() => r(new Error('逾時')), 9000))]);
    } catch (e) {
      $('login-msg').textContent = '無法啟動 LINE 登入，請從 LINE 開啟本頁，或稍後再試。';
      $('btn-line-login').classList.add('hidden'); $('btn-retry').classList.remove('hidden');
      return show('v-login');
    }
    if (!liff.isLoggedIn()) {
      $('btn-line-login').onclick = () => liff.login({ redirectUri: location.href });
      return show('v-login');
    }
    try { profile = await liff.getProfile(); }
    catch (e) { $('login-msg').textContent = '無法取得 LINE 身分，請重新整理。'; $('btn-retry').classList.remove('hidden'); $('btn-line-login').classList.add('hidden'); return show('v-login'); }

    $('loading-text').textContent = '讀取會員資料…';
    const ref = doc(db, 'users', profile.userId);
    let first = true;
    // 即時同步：管理員核准、退回、改名、改分類、設為管理員，這裡都會馬上更新
    unsub = onSnapshot(ref, snap => {
      user = snap.exists() ? snap.data() : null;
      if (first && user) {
        first = false;
        const upd = { memberLastLoginAt: serverTimestamp() };
        if (profile.pictureUrl && profile.pictureUrl !== user.pictureUrl) upd.pictureUrl = profile.pictureUrl;
        if (profile.displayName && profile.displayName !== user.lineDisplayName) upd.lineDisplayName = profile.displayName;
        updateDoc(ref, upd).catch(() => {});
      }
      first = false;
      render();
    }, () => {
      $('login-msg').textContent = '無法連線到資料庫，請重新整理。';
      $('btn-line-login').classList.add('hidden'); $('btn-retry').classList.remove('hidden');
      show('v-login');
    });
  }
  start();
</script>
</body>
</html>
