name: peek-body-zones
on: workflow_dispatch
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s https://bst-auth.eurekateamstar.workers.dev/body-zones > record/body-zones.json
          head -c 300 record/body-zones.json
          git config user.name "eurekateamstar-star"; git config user.email "eurekateamstar@gmail.com"
          git rm -q .github/workflows/peek.yml
          git add record/body-zones.json
          git commit -m "人體圖部位輪廓備份（示範影片用）"
          git push
